<style>
  :root{
    --wall:#e6e3d8;        /* 老厂房上半墙的白灰 */
    --dado:#2f4f45;        /* 墙裙墨绿 */
    --dado-2:#3d6255;
    --helmet:#e0a03a;      /* 安全帽黄 */
    --brick:#9c4a34;       /* 红砖，用于冲突与警示 */
    --ink:#1b201e;
    --ink-2:#5c6461;
    --lamp:#f3d89a;        /* 白炽灯暖光 */
    --line:#c9c5b6;
    --paper:#f2f0e7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--dado); color:var(--ink); line-height:1.75;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100%; padding:0;
  }
  .app{width:100%; max-width:620px; background:var(--wall); min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.35); position:relative; overflow:hidden;}

  /* ── 顶栏 ── */
  .bar{background:var(--dado); color:var(--wall); padding:10px 18px 9px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .when{font-size:15px; font-weight:700; letter-spacing:1px; white-space:nowrap;}
  .when small{font-size:11.5px; font-weight:400; opacity:.6; letter-spacing:0; margin-left:5px;}
  .rival{font-size:11px; opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gauges{background:var(--dado); color:var(--wall); padding:0 14px 11px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:9px;}
  .g{min-width:0;}
  .g .row{display:flex; align-items:baseline; gap:4px; white-space:nowrap;}
  .g .k{font-size:10.5px; opacity:.55; flex:none;}
  .g .v{font-size:13.5px; font-weight:700; letter-spacing:.3px; overflow:hidden; text-overflow:ellipsis;}
  .g .bars{display:flex; gap:2px; margin-top:4px;}
  .g .bars i{flex:1; height:3px; background:rgba(255,255,255,.18); display:block;}
  .g .bars i.on{background:var(--helmet);}
  .g.warn .v{color:#f2a891;}
  .g.warn .bars i.on{background:#c96a4e;}

  /* ── 场景画 ── */
  .stage{position:relative; background:linear-gradient(#dfe6e4 0%, #eae6d9 62%, #e3ddcc 100%);
    border-bottom:3px solid var(--dado);}
  .stage svg{width:100%; display:block;}

  /* ── 对白 ── */
  .talk{padding:16px 18px 4px;}
  .who{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
  .who svg{width:38px; height:38px; flex:none; border-radius:50%;
    background:var(--paper); border:1.5px solid var(--dado);}
  .who .nm{font-size:14.5px; font-weight:700;}
  .who .rl{font-size:11.5px; color:var(--ink-2); margin-left:1px;}
  .line{font-size:15.5px; min-height:5.2em; letter-spacing:.2px;}
  .line .q{color:var(--dado); font-weight:600;}
  .line em{font-style:normal; color:var(--brick); font-weight:600;}
  .narr{font-size:14.5px; color:var(--ink-2); min-height:5.2em;}

  /* ── 选项 ── */
  .picks{padding:6px 18px 22px; display:flex; flex-direction:column; gap:9px;}
  .pick{text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:var(--paper); border:1.5px solid var(--line); border-left:5px solid var(--dado);
    padding:11px 13px; transition:transform .12s, border-color .12s, background .12s;}
  .pick:hover{border-color:var(--dado); border-left-color:var(--helmet); transform:translateX(3px);}
  .pick:active{transform:translateX(1px);}
  .pick .t{font-size:15px; font-weight:600;}
  .pick .h{font-size:12px; color:var(--ink-2); margin-top:3px;}
  .pick .h b{font-weight:600; color:var(--brick);}
  .pick .hb{font-size:11px; color:var(--dado); margin-top:5px; padding-top:4px; border-top:1px dotted var(--line);}
  .because{font-size:12px; color:var(--dado); background:#e3ebe6; border-left:3px solid var(--dado);
    padding:6px 10px; margin:0 0 10px; line-height:1.55;}
  .pick .h i{font-style:normal; color:var(--dado-2); font-weight:600;}
  .pick:disabled{opacity:.55; cursor:not-allowed;}
  .pick.lock{border-left-color:#b9b3a4; background:#eceadf;}
  .pick.lock .t{text-decoration:line-through; color:#8d877a; font-weight:500;}
  .pick.lock:hover{transform:none; border-color:var(--line);}
  .hb.lk{color:#8d877a; border-top-color:#ddd8c9;}

  .go{display:block; width:calc(100% - 36px); margin:2px 18px 22px; font:inherit;
    font-size:15px; font-weight:700; letter-spacing:2px; padding:12px;
    background:var(--dado); color:var(--wall); border:none; cursor:pointer;}
  .go:hover{background:var(--dado-2);}

  /* ── 反馈 ── */
  .deskhd{padding:14px 18px 2px; font-size:15px; font-weight:700;}
  .deskhd span{display:block; font-size:12.5px; font-weight:400; color:var(--ink-2); margin-top:3px; line-height:1.6;}
  .deskhd b{color:var(--brick);}
  .tasks{display:flex; flex-direction:column; gap:8px; padding:12px 18px 16px;}
  .task{text-align:left; font:inherit; color:inherit; background:var(--paper); cursor:pointer;
    border:1.5px solid var(--line); border-left:5px solid var(--dado); padding:11px 13px;
    transition:transform .12s, border-color .12s;}
  .task:hover:not(:disabled){border-color:var(--dado); border-left-color:var(--helmet); transform:translateX(3px);}
  .task.poor{opacity:.4; cursor:not-allowed;}
  .tk{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .tw{font-size:11.5px; color:var(--ink-2);}
  .tc{font-size:11px; color:var(--helmet); letter-spacing:1px;}
  .tt{font-size:15px; font-weight:600; margin-top:3px;}
  .tb{font-size:12.5px; color:var(--ink-2); margin-top:4px; line-height:1.6;}
  .planhd{padding:14px 18px 4px; font-size:15px; font-weight:700;}
  .planhd span{display:block; font-size:12.5px; font-weight:400; color:var(--ink-2); margin-top:2px;}
  .facs{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 18px 18px;}
  .fac{text-align:left; font:inherit; color:inherit; background:var(--paper);
    border:1.5px solid var(--line); border-left:5px solid var(--dado); padding:9px 10px; cursor:pointer;
    transition:transform .1s, border-color .1s;}
  .fac:hover:not(:disabled){border-color:var(--dado); border-left-color:var(--helmet); transform:translateY(-2px);}
  .fac.poor{opacity:.45; cursor:not-allowed;}
  .fac.done{border-left-color:var(--helmet); opacity:.7; cursor:default;}
  .fh{display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .fn{font-size:13.5px; font-weight:700;}
  .fd{display:flex; gap:2px;}
  .fd i{width:9px; height:4px; background:var(--line); display:block;}
  .fd i.on{background:var(--helmet);}
  .fc{font-size:11.5px; color:var(--ink-2); margin-top:3px;}
  .fu{font-size:12.5px; font-weight:600; color:var(--dado); margin-top:4px;
    display:flex; justify-content:space-between; gap:6px;}
  .fu b{color:var(--brick);}
  .fi{font-size:11.5px; color:var(--ink-2); margin-top:4px; line-height:1.5;}
  .fk{font-size:10.5px; color:#8d9b93; margin-top:5px; padding-top:4px; border-top:1px dotted var(--line);}
  @media (max-width:430px){ .facs{grid-template-columns:1fr;} .fi{display:none;} }
  .evtag2{display:inline-block; font-size:11px; letter-spacing:2px; padding:3px 10px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink-2);}
  .evtag2.bad{border-color:#d0a294; background:#f7e9e4; color:var(--brick);}
  .evtag2.good{border-color:#9db3a6; background:#e5ece7; color:var(--dado);}
  .fx{padding:0 18px 14px; display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-size:11.5px; padding:3px 9px; border:1px solid var(--line); background:var(--paper);}
  .tag.up{border-color:#8aa596; color:#2f4f45;}
  .tag.down{border-color:#d0a294; color:var(--brick);}

  /* ── 开场 / 结局 ── */
  .cover{padding:0 0 26px;}
  .cover .body{padding:0 22px;}
  .art{position:relative; background:#e9e2d1; border-bottom:3px solid var(--dado);}
  .art svg{width:100%; display:block;}
  .ttl{background:var(--dado); color:var(--wall); padding:17px 22px 16px;}
  .cover h1{font-size:32px; font-weight:800; letter-spacing:8px; margin:0; line-height:1.2;
    color:#f4f1e6;}
  .cover .sub{font-size:12.5px; color:#a9bdb2; letter-spacing:3px; margin-top:7px;}
  .yrtag{position:absolute; top:0; right:18px; background:var(--brick); color:#f7f2e6;
    font-size:11.5px; letter-spacing:4px; padding:9px 8px 8px; writing-mode:vertical-rl;
    text-orientation:upright; line-height:1.4; box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .lede{font-size:15.5px; margin:18px 0 0; font-weight:600;}
  .rule{height:1px; background:var(--line); margin:16px 0 14px;}
  .cover p{font-size:15px; margin:12px 0;}
  .about{padding:18px 22px 30px; font-size:14px; line-height:1.85;}
  .about h3{font-size:15px; margin:20px 0 6px; color:var(--dado); letter-spacing:1px;}
  .about p{margin:0 0 9px;}
  .about .kv{display:flex; gap:10px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .about .kv span{flex:0 0 76px; color:var(--ink-2);}
  .about .cr{margin-top:18px; padding:12px 14px; background:var(--paper); border-left:3px solid var(--brick);
    font-size:12.5px; color:var(--ink-2); line-height:1.8;}
  .prog{margin:16px 0 4px; padding:11px 13px; background:var(--paper); border:1px solid var(--line);}
  .prog b{color:var(--dado);}
  .prog .pb{height:6px; background:#ddd7c7; margin-top:7px;}
  .prog .pb i{display:block; height:6px; background:var(--dado);}
  .foot{margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-2); line-height:1.9;}
  .foot a{color:var(--dado);}
  .lnk{background:none; border:none; font:inherit; color:var(--dado); text-decoration:underline;
    cursor:pointer; padding:0;}
  .roles{padding:16px 22px 26px;}
  .roles .lead{font-size:14.5px; margin:0 0 4px;}
  .roles .hint{font-size:12.5px; color:var(--ink-2); margin:0 0 14px; line-height:1.7;}
  .rcard{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
    background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--dado);
    padding:13px 14px; margin-bottom:10px; font:inherit; cursor:pointer;}
  .rcard:active{background:#efe9db;}
  .rcard svg{width:42px; height:42px; flex:0 0 42px;}
  .rcard .rn{font-size:15.5px; font-weight:700;}
  .rcard .rt{font-size:12px; color:var(--brick); margin:1px 0 5px; letter-spacing:1px;}
  .rcard .rd{font-size:12.5px; color:var(--ink-2); line-height:1.65;}
  .rcard .rs{font-size:11.5px; color:var(--ink-2); margin-top:6px;}
  .rcard .rs b{color:var(--dado);}
  .rcard.soon{border-left-color:#b9b3a2; cursor:default; opacity:.62;}
  .rcard.soon:active{background:var(--paper);}
  .rlock{font-size:11px; background:#cac4b3; color:#5d574c; padding:2px 7px; margin-left:6px;}
  .crew{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0 6px;}
  .crew div{background:var(--paper); border:1px solid var(--line); padding:10px; text-align:center;}
  .crew svg{width:44px; height:44px;}
  .crew b{display:block; font-size:13.5px; margin-top:4px;}
  .crew span{font-size:11px; color:var(--ink-2); line-height:1.5; display:block;}
  .name-in{width:100%; font:inherit; font-size:16px; padding:11px 13px; margin-top:6px;
    background:var(--paper); border:1.5px solid var(--line); color:var(--ink);}
  .name-in:focus{outline:none; border-color:var(--dado);}

  .end-h{background:var(--dado); color:var(--wall); padding:26px 22px 24px;}
  .end-h .no{font-size:11.5px; opacity:.6; letter-spacing:2px;}
  .end-h h2{font-size:27px; font-weight:800; letter-spacing:3px; margin:5px 0 0; line-height:1.35;}
  .end-b{padding:20px 22px 26px;}
  .end-b p{font-size:15px; margin:0 0 14px;}
  .after{border-top:1px solid var(--line); padding-top:14px; margin-top:6px;}
  .after .r{display:flex; gap:10px; align-items:flex-start; margin:11px 0; font-size:13.5px;}
  .after .r svg{width:32px; height:32px; flex:none; border-radius:50%;
    background:var(--paper); border:1.5px solid var(--line);}
  .after .r b{font-weight:700;}
  .reveal{background:var(--paper); border:1.5px solid var(--line); padding:14px 16px; margin:16px 0;}
  .reveal .t{font-size:12px; color:var(--ink-2); margin-bottom:8px;}
  .reveal .row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;
    border-bottom:1px dotted var(--line);}
  .reveal .row:last-child{border:none;}
  .reveal .row b{font-variant-numeric:tabular-nums;}
  .gf,.unlk{background:var(--paper); border:1.5px solid var(--line); padding:13px 14px; margin:16px 0;}
  .gft{font-size:12.5px; color:var(--ink-2); margin-bottom:9px;}
  .gft b{color:var(--dado); font-size:14px;}
  .gfg{display:flex; flex-wrap:wrap; gap:5px;}
  .gfg span{font-size:11.5px; padding:3px 8px; border:1px solid var(--line);}
  .gfg .y{background:var(--dado); color:var(--wall); border-color:var(--dado);}
  .gfg .n{color:#a09a8e;}
  .gfr{font-size:13.5px; margin-top:11px; line-height:1.75;}
  .gfn{font-size:11.5px; color:var(--ink-2); margin-top:9px; line-height:1.65;}
  .ug{display:flex; flex-wrap:wrap; gap:5px;}
  .ug span{font-size:11.5px; padding:3px 8px; border:1px dashed var(--line); color:#a09a8e;}
  .ug .y{background:#e3ebe6; color:var(--dado); border-style:solid; border-color:#9db3a6;}
  .card{background:var(--dado); color:var(--wall); padding:16px; margin:16px 0 8px; font-size:12.5px; line-height:1.8;}
  .card b{color:var(--helmet);}
  .ends{margin:16px 0 0; font-size:12.5px; color:var(--ink-2);}
  .ends .grid{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .ends .grid span{border:1px solid var(--line); padding:3px 8px; background:var(--paper);}
  .ends .grid span.got{background:var(--dado); color:var(--wall); border-color:var(--dado);}
  .btns{display:flex; gap:9px; flex-wrap:wrap; margin-top:18px;}
  .btns button{font:inherit; font-size:14px; font-weight:600; padding:11px 18px; cursor:pointer;
    background:var(--dado); color:var(--wall); border:none;}
  .btns button.ghost{background:transparent; color:var(--dado); border:1.5px solid var(--dado);}

  @media (max-width:430px){
    .cover h1{font-size:28px; letter-spacing:4px;}
    .gauges{padding:0 11px 10px; gap:7px;}
    .g .k{font-size:10px;} .g .v{font-size:12.5px;}
    .bar{padding:9px 12px 8px;} .when{font-size:14px;}
    .rival{font-size:10.5px;}
    .line{font-size:15px;}
  }
  @media (max-width:340px){ .g .k{display:none;} }
  @media (prefers-reduced-motion:reduce){ .pick{transition:none;} }
</style>
</head>

<script>

{y:10, s:'春', who:'narr', title:'邻居投诉噪声和异味', cost:1, ig:{t:'投诉一直没处理。入夏之后有人往生态环境部门举报，还拍了视频。街道办第三次打电话来时，语气已经不客气了。', fx:{risk:1,fame:-1}}, key:1,

 o:[
  {t:'停夜班，白天生产', h:'<i>产能掉两成</i> · 投诉会停',
   r:'夜班停了，投诉也停了。但订单交期开始紧张，有两家客户转了单。老赵算给你看：一年少赚八十万。你说："这钱是从人家窗户底下抢的。"他没接话。',

   r:'隔声屏和活性炭装置装了三个月。街道办后来把你们厂当成正面案例，在社区会上讲过一次。有位老太太送了面锦旗，上面写着"还我安宁"——〔#zhou〕把它挂在了传达室。',
   fx:{money:-46, fame:6, morale:3, smoke:-2, flag:'noise_fixed'}},

   r:'你去街道办说明情况，态度诚恳，又送了两台净化器给居委会。投诉少了一阵，夜班一天没停，那笔五十五万留在账上过了个宽裕的冬天。'

{y:10, s:'秋', who:'lin', title:'一笔要加班两个月的大单', cost:1, ig:{t:'你没有下决心，林薇按常规产能报了个交期，客户嫌慢，转给了宏远。车间那两个月很轻松。', fx:{orders:-1,rival:1,group:-1}},

 o:[
  {t:'接，全厂动员', h:'<i>钱和面子</i> · 人会很累',
   r:'两个月，车间的灯几乎没灭过。单子交了，年终奖发得比往年厚，集团通报点了名。但年后走了七个人，其中三个是干了十年以上的老师傅。〔#zhou〕说："钱能补，人补不回来。"',
   fx:{money:50, orders:8, morale:-15, smoke:5, group:8}},
  {t:'接一半，另一半推给同行', h:'<i>少赚</i> · 人不垮',
   r:'林薇把一半的量介绍给了另一家小厂，还拿了协调费。客户没有不满，反而觉得你们实在。年后没有人辞职。',
   fx:{money:26, orders:4, morale:2, aff:{lin:2}}},
  {t:'不接，产能不够就是不够', h:'<i>放弃</i>',
   r:'这单被宏远接走。老赵在会上算了笔账，说够全厂两个月的利润。你说："算不进去的是那七个人。"他没再说话。',

{y:11, s:'春', who:'ma', title:'马副总一个人来了', cost:1, ig:{t:'你陪他在车间外站了会儿，聊的都是场面话。他上车前看了你一眼，什么也没说。半年后他退了。', fx:{group:-1}}, key:1,

 o:[
  {t:'请他把绿色投入单列一项考核', h:'<i>他要为此得罪人</i>',
   r:'他听完只说"我试试"。半年后集团确实加了一项"绿色制造"考核，权重不高，但从此这些投入不再是"额外的支出"。代价是他在那次会上得罪了两位同级。他没跟你提过这件事，是老赵后来听说的。',

   because:'你这些年做出的东西，够他在会上举例子',

  {t:'请他多批点预算', h:'<i>实在</i> · 但只解一时',
   r:'他批了一百二十万专项。钱很快就花完了，用在了该用的地方。但第二年他退了，新来的人不认这笔账，问的第一个问题是"去年那笔钱产出是多少"。',
   fx:{money:58, group:2, aff:{ma:2}}},
  {t:'什么都没说，陪他在车间外站着', h:'<i>有些话说了也没用</i>',
   r:'你们抽了两根烟。他临走说："我在这个位子上二十年，见过太多厂长跟我讲道理。你算讲得少的。"上车前他补了一句："厂子是你的，我是过路的。"',
   fx:{aff:{ma:3}, morale:1}}
 ]},
{y:11, s:'秋', who:'zhao', title:'本行业纳入了碳市场', cost:1, ig:{t:'配额是财务按最低标准买的，多花了不少钱。这件事从此每年都要花一笔，而你始终没想明白它到底能不能省。', fx:{money:-10}},

   r:'配额买了，合规了。老赵每年做预算的时候都会单列这一行，数字一年比一年大。他说："这笔钱是白花的。"你说："不是白花，是替过去的十年还账。"',

   r:'你把碳市场当成了说服所有人的理由——包括集团、老赵、还有那些觉得节能是折腾的人。锅炉、空压、电机一起改完，第二年不但不用买配额，还富余出一点可以卖。老赵第一次主动说了句："这钱花得值。"',
   fx:{money:-70, smoke:-14, group:4, fame:4, aff:{zhao:3, chen:4}, flag:'quota_cut'}},
  {t:'先按最低标准应付，观望一年', h:'<i>观望</i> · 明年配额只会更贵',
   r:'你选择观望。第二年配额价格涨了四成，你多掏了将近一倍的钱。这类事情的规律是：越晚动手越贵，而每一年当时看都"再等等也行"。',
   fx:{money:-20, smoke:2, flag:'quota_wait'}}
 ]},
{y:12, s:'春', who:'lin', title:'新客户要产品碳足迹报告', cost:2, ig:{t:'你让办公室回了封客气的邮件，说正在筹备中。对方没有再来。三年后这家客户成了行业头部，一级供应商里有宏远。', fx:{orders:-2,rival:2}}, key:1,

{y:12, s:'秋', who:'zhou', title:'VOCs 设施平时没开', cost:1, ig:{t:'这句话你听过就算了。设施照旧是检查才开，厂里所有人都懂那句灵活掌握是什么意思。', fx:{risk:1,flag:'voc_off'}}, key:1,
 t:'〔zhou:厂长，有件事我憋了两年，今天跟您说。|老周退了以后没人再提这事，今天是我壮着胆子说的。〕<em>VOCs 那套治理设施，这两年基本没开过</em>，一开电费一个月多两万。老工人都知道，就是没人说。',

   r:'设施开了，电费涨了，报表难看了。没有客户会因为这个多给你一分钱，没有媒体会来报道。三年后一次夜查，执法人员调了运行记录，看完什么也没说就走了——那一刻你才知道这笔钱买的是什么。',

{y:6, s:'夏', who:'zhou', pool:1, title:'老周和〔陈工|小吴〕吵起来了', cost:1,
 ig:{t:'你没有表态。这场架从此就摆在那儿，谁也不提，谁也不忘。车间和技术科从此各说各话，中间隔着一堵看不见的墙。', fx:{morale:-2, aff:{zhou:-3, chen:-3}}},

   r:'你在会上说了句"生产是第一位的"。车间的人心定了，交期保住了。散会后〔陈工|小吴〕一个人在办公室坐了很久，那份方案他没再拿出来过。',
   fx:{morale:6, orders:4, smoke:2, aff:{zhou:4, chen:-6}}},
  {t:'当众支持〔陈工|小吴〕', h:'<i>技术条线来劲</i> · 老周下不来台',
   r:'停线三天，工艺改成了。老周当着人没说什么，只是那之后他再没在会上主动发过言。有些人不是被否定打垮的，是被当众否定。',
   fx:{smoke:-5, tech:6, morale:-6, aff:{chen:5, zhou:-6}}},
  {t:'谁也不表态，会后分别谈', h:'<i>累</i> · 但两个都保住了',
   r:'你分别找他们谈了一下午，最后方案改成分批停线，交期延三天。两个人都觉得自己没输，也都觉得你偏袒了对方一点点——这大概就是当厂长的常态。',
   fx:{smoke:-3, orders:-2, morale:2, aff:{zhou:1, chen:1}, flag:'balanced_call'}}

{y:9, s:'夏', who:'zhao', pool:1, title:'有人越级告状', cost:1,

   r:'工作组查了半个月，结论是"程序有瑕疵，无违纪问题"。查清之后没人再提这事。但那半个月你什么也没干成，而且从此你知道，这厂里有人在盯着你。',
   fx:{money:-10, orders:-4, group:4, flag:'cleared'}},
  {t:'先找出这是谁写的', h:'<i>会查到</i> · 但代价是人心',

  {t:'不理，该干什么干什么', h:'<i>清者自清</i> · 也可能越描越黑',
   r:'你没有专门回应，只是把所有决策的会议纪要整理归档。三个月后事情不了了之。老赵说了句："厂长，您这次是运气好。下次记得先把纪要做全。"',

{y:12, s:'夏', who:'ma', pool:1, title:'新领导不认旧账', cost:1,

 t:'（马副总退了，来的是位新的）<em>你们厂这些年在绿色上花的钱不少，产出我没看明白。</em>老同志留下的账，我得重新算一遍。',
 o:[
  {t:'把这些年的数据一条条摆给他看', h:'<i>要拿得出东西</i>',
   r:'你调出了历年能耗曲线、客户审核结论、罚款记录（一次都没有）。他看完只说了句："这些数据比我在集团看到的报表实在。"往后他成了你在集团最稳的支持者。',
   fx:{group:14, fame:4, aff:{ma:4}, flag:'new_ally'},
   uid:'new_boss_data', because:'这些年的数据你是一笔笔记下来的',

  {t:'讲这些年的故事，讲人和事', h:'<i>动情</i> · 但他要的是数',
   r:'你讲了〔#zhou〕、讲了那次督察、讲了停线两周改废水。他听得很认真，最后说："都是好故事。数据整理一份给我。"这句话你听了很多年，每次都是同一个意思。',
   fx:{group:2}},
  {t:'先摸他的路数，别急着表态', h:'<i>谨慎</i> · 也可能错过窗口',
   r:'你陪着看了一圈，没多说什么。他也没多问。半年后集团的资源分配方案下来，你们厂在中游偏后——不是被针对，只是没有存在感。',
   fx:{group:-5}}
 ]},
{y:13, s:'夏', who:'zhou', pool:1, title:'该提拔谁', cost:1,
 ig:{t:'位子一直空着，两个人都在等。半年后其中一个提了辞职，另一个也再没提过什么想法。', fx:{morale:-2, orders:-1}},
 t:'技术科长的位子要定人。<em>一个是跟了十年的老人，稳，但这些年没什么长进；一个是新来三年的，能干，但资历浅、脾气冲。</em>',
 o:[
  {t:'提老人', h:'<i>人心稳</i> · 技术条线会闷住',
   r:'老人上任，科里风平浪静。那个年轻人第二年走了，去了宏远。三年后你在行业会上见到他，他管着宏远的整个技术条线。',

  {t:'提年轻人', h:'<i>能干活</i> · 老人会寒心',
   r:'年轻人上任三个月就捅了两个娄子，也做成了三件老人十年没做成的事。那位老同志申请调去了后勤，走的时候什么也没说。',
   fx:{tech:10, smoke:-4, morale:-7, aff:{zhou:-3}}},
  {t:'让两个人竞聘，全厂投票', h:'<i>公开</i> · 但会摆到台面上',
   r:'投票结果年轻人赢了三票。过程是公开的，谁也没话说，但那三票把厂里的分歧摆到了明面上。〔#zhou〕说："厂长，有些事不投票，是为了不让人记恨。"',

  {t:'也去说他们两句', h:'<i>互泼脏水</i>',

function txGone(key){
  if(key === 'zhou') return zhouGone();
  if(key === 'liu')  return liuGone();
  if(key === 'ma')   return maGone();
  if(key === 'lin')  return linGone();
  if(key === 'zhao') return zhaoGone();

}
function tx(str){
  if(!str) return str;
  return String(str)
    .replace(/〔#([a-z]+)〕/g, function(m, k){ return nameOf(k); })
    .replace(/〔(?:([a-z]+):)?([^|〕]*)\|([^〕]*)〕/g, function(m, k, a, b){
      return txGone(k || 'chen') ? b : a;
    });
}

  if(!zhouGone()) return 'zhou';
  return (S.flag.zhou_pass && !liuGone()) ? 'liu' : 'ban';

  if(w === 'chen' && S.flag.chen_left) return 'wu';
  if(w === 'zhou') return shopKey();
  if(w === 'ma' && maGone()) return 'ma2';
  if(w === 'lin' && linGone()) return 'xin';
  return w;
}

  if(key === 'chen') return S.flag.chen_left ? '小吴' : '陈工';

/* ── 状态条 ── */
function gauge(label, text, v, warn){
  var on = Math.round(pct(v)/20), bars='';
  for(var i=0;i<5;i++) bars += '<i class="'+(i<on?'on':'')+'"></i>';
  return '<div class="g'+(warn?' warn':'')+'"><div class="row"><span class="k">'+label+'</span>'
    + '<span class="v">'+text+'</span></div><div class="bars">'+bars+'</div></div>';
}
function word(v, a){ return v>=78?a[0] : v>=58?a[1] : v>=38?a[2] : a[3]; }
function statBox(k){
  var d = STAT[k], v = S[k] || 0, txt, on;
  if(d.abs){ txt = fmtStat(k, v); on = Math.round(pct(v / d.scale) / 20); }
  else { txt = word(v, d.w); on = Math.round(pct(v) / 20); }
  var bars = '';
  for(var i = 0; i < 5; i++) bars += '<i class="' + (i < on ? 'on' : '') + '"></i>';
  var warn = (d.warn !== undefined) && v < d.warn;
  return '<div class="g' + (warn ? ' warn' : '') + '"><div class="row"><span class="k">' + d.lab
    + '</span><span class="v">' + txt + '</span></div><div class="bars">' + bars + '</div></div>';
}
function gaugeRow(){ return '<div class="gauges">' + R().gauges.map(statBox).join('') + '</div>'; }
/* 统一的数值变动＋标签：加新角色只要在 STAT 里登记，这里不用动 */
function applyFx(f){
  var tags = [], k;
  for(k in f){
    if(k === 'aff' || k === 'flag' || k === 'fac' || k === 'report') continue;
    var d = STAT[k], v = f[k];
    if(!d || !v) continue;
    if(d.abs){ S[k] = (S[k] || 0) + v; if(d.min !== undefined) S[k] = Math.max(d.min, S[k]); }
    else if(d.raw) S[k] = Math.max(0, Math.min(d.max === undefined ? 999 : d.max, (S[k] || 0) + v));
    else S[k] = pct((S[k] || 0) + v);
    if(d.hidden) continue;
    var goodDir = (d.good === -1) ? -1 : 1;
    var cls = ((v > 0 ? 1 : -1) === goodDir) ? 'up' : 'down';
    var body = d.abs ? ((v > 0 ? '+' : '') + fmtStat(k, v))
                     : (d.lab + (v > 0 ? (d.up || ' ↑') : (d.dn || ' ↓')));
    tags.push('<span class="tag ' + cls + '">' + body + '</span>');
  }
  if(f.report) S.reportCount = (S.reportCount || 0) + f.report;
  if(f.fac) for(var fk in f.fac) facBump(fk, f.fac[fk]);
  if(f.aff) for(var ak in f.aff) S.aff[ak] = (S.aff[ak] || 0) + f.aff[ak];
  if(f.flag){ S.flag[f.flag] = true;
    if(f.flag === 'zhou_pass' || f.flag === 'zhou_quit') S.flag.zhou_out = true;
    if(f.flag === 'm_cost') S.mode = 'cost';
    if(f.flag === 'm_tech') S.mode = 'tech';
    if(f.flag === 'm_brand') S.mode = 'brand';
  }
  return tags;
}
function bar(sub){
  return '<div class="bar"><div class="when">第 '+(S.year||1)+' 年'
    + (sub ? '<small>'+sub+'</small>' : '')+'</div>'
    + '<div class="rival">'+(R().top ? R().top() : rivalLine())+'</div></div>' + gaugeRow();
}
/* 对门那家厂，是你的镜子 */
function rivalLine(){
  if((S.year||1) < 2) return '对门 · 宏远厂';
  var d = (S.orders + S.fame) - S.rival;
  if(d >= 40) return '宏远厂 · 被你甩开了';
  if(d >= 14) return '宏远厂 · 你稍占上风';
  if(d >= -14) return '宏远厂 · 咬得很紧';
  if(d >= -46) return '宏远厂 · 跑在你前面';
  return '宏远厂 · 已经不是一个量级';
}

/* ── 打字机 ── */
function typeIn(el, text, done){
  if(TYPING) clearInterval(TYPING);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ el.innerHTML = text; if(done) done(); return; }
  var plain = text.replace(/<[^>]+>/g,''), i = 0;
  el.innerHTML = '';
  TYPING = setInterval(function(){
    i += 2;
    if(i >= plain.length){ clearInterval(TYPING); TYPING = null; el.innerHTML = text; if(done) done(); return; }
    el.textContent = plain.slice(0, i);
  }, 16);
}
function skipType(el, text){ if(TYPING){ clearInterval(TYPING); TYPING=null; el.innerHTML = text; return true; } return false; }

/* ── 渲染场景 ── */
function render(){ if(S.cur) renderScene(S.cur); }
function renderScene(raw){
  var useAlt = !!(raw.alt && raw.alt.need && raw.alt.need(S));
  var sc = useAlt ? {y:raw.y, s:raw.s, who:raw.who, title:raw.title, t:raw.alt.t, o:raw.alt.o,
                     because:raw.alt.because, uid:raw.alt.uid} : raw;
  S.cur = raw;
  if(useAlt && sc.uid) S.seen[sc.uid] = 1;
  var wk = whoKey(sc.who);
  var c = CAST[wk] || CAST.narr;
  var isNarr = sc.who === 'narr';
  var html = '<div class="bar"><div class="when">第 ' + S.year + ' 年<small>'
    + (sc.title ? tx(sc.title) : '这一年') + '</small></div>'
    + '<div class="rival">' + (S.energy > 0 ? '精力还剩 ' + '●'.repeat(S.energy) : '精力已用完') + '</div></div>'
    + gaugeRow() + scene() + '<div class="talk">';
  if(!isNarr) html += '<div class="who">' + FACE[wk] + '<div><div class="nm">' + c.n + '</div><div class="rl">' + c.r + '</div></div></div>';
  if(sc.because) html += '<div class="because">因为' + sc.because + '，这一幕不一样了</div>';
  html += '<div class="' + (isNarr?'narr':'line') + '" id="line"></div></div><div class="picks" id="picks"></div>';
  app.innerHTML = html;

  var lineEl = document.getElementById('line');
  var body = (raw.dyn ? raw.dyn(S) : sc.t);
  var txt = (isNarr ? '' : '<span class="q">「</span>') + tx(body) + (isNarr ? '' : '<span class="q">」</span>');
  app.onclick = function(){ if(skipType(lineEl, txt)) showPicks(sc); };
  typeIn(lineEl, txt, function(){ showPicks(sc); });
  setTimeout(function(){ var p=document.getElementById('picks'); if(p && !p.children.length) showPicks(sc); }, 2400);
}
function showPicks(sc){
  var box = document.getElementById('picks');
  if(!box || box.children.length) return;
  sc.o.forEach(function(op, idx){
    var locked = !!(op.need && !op.need(S));
    if(!locked && op.uid) S.seen[op.uid] = 1;
    var b = document.createElement('button');
    b.className = 'pick' + (locked ? ' lock' : '');
    if(locked){
      b.disabled = true;
      b.innerHTML = '<div class="t">' + tx(op.t) + '</div>'
        + '<div class="hb lk">这条路你走不了 —— 它要的是：' + (op.because || '前些年埋下的某个条件') + '</div>';
    } else {
      b.innerHTML = '<div class="t">' + tx(op.t) + '</div>' + (op.h ? '<div class="h">' + tx(op.h) + '</div>' : '')
        + (op.because ? '<div class="hb">这个选项出现，是因为' + op.because + '</div>' : '');
      b.onclick = function(){ choose(sc, op); };
    }
    box.appendChild(b);
  });
}

/* ── 应用选择 ── */
function choose(sc, op){
  app.onclick = null;
  var tags = applyFx(op.fx || {});
  S.log.push({y:sc.y, pick:op.t});
  if(!op.r) return afterScene();
  var rtext = tx(op.r) + (op.coda ? tx(op.coda(S) || '') : '');
  app.innerHTML = '<div class="bar"><div class="when">第 ' + S.year + ' 年<small>'
    + (sc.title ? tx(sc.title) : '') + '</small></div></div>'
    + gaugeRow() + scene()
    + '<div class="talk"><div class="narr" id="line"></div></div>'
    + '<div class="fx">' + tags.join('') + '</div>'
    + '<button class="go" id="go">继续</button>';
  var lineEl = document.getElementById('line');
  typeIn(lineEl, rtext);
  document.getElementById('go').onclick = function(){
    if(skipType(lineEl, rtext)) return;
    afterScene();
  };
}

/* ══════════ 年度待办：桌上摆着好几件事，你一年推得动的就那么两件 ══════════ */
function energyCap(){ return R().energy(); }
function bossEnergy(){
  var e = 2;
  if(S.flag.vp_zhou || S.flag.vp_out) e++;      /* 有副厂长分担 */
  if(S.flag.assistant) e++;
  return e;
}

function deskYear(y){
  S.year = y;
  var byY = {}, i;
  var LIB = R().lib;
  for(i = 0; i < LIB.length; i++){ var x = LIB[i]; (byY[x.y] = byY[x.y] || []).push(x); }
  var list = (byY[y] || []).slice();
  var forced = list.filter(function(x){ return x.inspect || !x.title; });   /* 督察、收尾这类必经 */
  var pool = list.filter(function(x){ return x.title && !x.inspect && (!x.need || x.need(S)); });
  function shuf(arr){
    for(var a = arr.length - 1; a > 0; a--){
      var b = Math.floor(Math.random() * (a + 1)), t = arr[a]; arr[a] = arr[b]; arr[b] = t;
    }
    return arr;
  }
  var keys = shuf(pool.filter(function(x){ return x.key; }));
  var rest = shuf(pool.filter(function(x){ return !x.key; }));
  /* 越往后，桌上的事越多，精力却没跟着涨 */
  var base = R().deskSize ? R().deskSize(y) : (y >= 11 ? 5 : y >= 6 ? 4 : 3);
  var n = Math.min(pool.length, base + (Math.random() < 0.35 ? 1 : 0));
  var pick = keys.slice(0, Math.max(1, n - 1)).concat(rest);
  if(keys.length > n - 1) pick = keys.slice(0, n).concat(rest);
  S.desk = pick.slice(0, n);
  S.forced = forced;
  S.energy = energyCap();
  S.deskDone = [];
  showDesk();
}

/* 卡片上摊开事情本身：不用点进去也知道是什么 */
function firstLine(sc){
  var t = String(sc.t || '').replace(/<[^>]+>/g, '');
  var m = t.split(/[。？！]/);
  var out = m[0] || t;
  if(out.length < 16 && m[1]) out += '。' + m[1];
  return out.slice(0, 48) + (out.length > 48 ? '…' : '。');
}
/* 若这一幕会被隐藏分支替换，清单上就该显示替换后的样子 */
function faceOf(sc){
  if(sc.alt && sc.alt.need && sc.alt.need(S)){
    return {title: sc.alt.title || sc.title, t: sc.alt.t, who: sc.alt.who || sc.who,
            brief: sc.alt.brief, cost: sc.cost};
  }
  return sc;
}
function showDesk(){
  app.onclick = null;
  var restN = 0, ri;
  for(ri = 0; ri < S.desk.length; ri++) if(S.deskDone.indexOf(ri) < 0) restN++;
  if(restN === 0) return closeYear();            /* 桌上空了，别渲染一张空桌子 */
  if(S.energy <= 0) return closeYear();
  var rows = S.desk.map(function(sc, idx){
    if(S.deskDone.indexOf(idx) >= 0) return '';
    var fc = faceOf(sc);
    var who = CAST[whoKey(fc.who)] || CAST.narr;
    var dots = sc.cost >= 2 ? '●●' : '●';
    var afford = S.energy >= sc.cost;
    var brief = tx(fc.brief || firstLine(fc));
    return '<button class="task' + (afford ? '' : ' poor') + '"' + (afford ? '' : ' disabled')
      + ' onclick="pickTask(' + idx + ')">'
      + '<div class="tk"><span class="tw">' + (fc.who === 'narr' ? '厂里' : who.n + '　找你') + '</span>'
      + '<span class="tc">' + dots + (afford ? '' : '　精力不够') + '</span></div>'
      + '<div class="tt">' + tx(fc.title) + '</div>'
      + '<div class="tb">' + brief + '</div></button>';
  }).join('');
  app.innerHTML = '<div class="bar"><div class="when">第 ' + S.year + ' 年<small>桌上的事</small></div>'
    + '<div class="rival">' + (R().top ? R().top() : rivalLine()) + '</div></div>'
    + gaugeRow()
    + '<div class="deskhd">今年这些事都摆在你桌上。<span>事情都写在上面了，你的精力只够办 <b>'
    + S.energy + '</b> 份（●＝一份）。<b>点下去就是办</b>，没办的年底会自己有结果。</span></div>'
    + '<div class="tasks">' + rows + '</div>'
    + '<button class="go" onclick="closeYear()">今年就这样，过年吧</button>';
}

function pickTask(idx){
  var sc = S.desk[idx];
  if(S.energy < sc.cost) return;
  S.energy -= sc.cost;
  S.deskDone.push(idx);
  S.cur = sc;
  if(sc.build) return buildSheet();
  renderScene(sc);
}

/* 技改方案：在清单里跟别的事抢同一份精力 */
function buildSheet(){
  app.onclick = null;
  var rows = FACILITIES.map(function(f){
    var lv = facLv(f.k), cur = f.lv[lv], nxt = f.lv[lv + 1], dots = '';
    for(var i = 0; i < f.lv.length - 1; i++) dots += '<i class="' + (i < lv ? 'on' : '') + '"></i>';
    if(!nxt) return '<div class="fac done"><div class="fh"><span class="fn">' + f.n + '</span><span class="fd">' + dots
      + '</span></div><div class="fc">' + cur.n + ' · 已到顶</div></div>';
    var ok = S.money >= nxt.cost;
    return '<button class="fac' + (ok ? '' : ' poor') + '"' + (ok ? '' : ' disabled')
      + ' onclick="doBuild(\'' + f.k + '\')">'

/* 年底：没办的事自己结账 */
function closeYear(){
  var left = [];

  S.pending = left;
  S.pendIdx = 0;
  runPending();
}
function runPending(){
  if(S.pendIdx >= S.pending.length) return runForced();
  var sc = S.pending[S.pendIdx++];
  if(!sc.ig) return runPending();
  var tags = applyFx(sc.ig.fx || {});
  app.onclick = null;
  app.innerHTML = '<div class="bar"><div class="when">第 ' + S.year + ' 年<small>没顾上的事</small></div></div>'
    + gaugeRow() + scene()
    + '<div class="talk"><div class="evtag2 bad">' + tx(faceOf(sc).title) + '　·　你没有处理</div>'
    + '<p style="font-size:14.5px;margin:10px 0 0">' + tx(sc.ig.t) + '</p></div>'
    + '<div class="fx">' + tags.join('') + '</div>'
    + '<button class="go" id="go">继续</button>';
  document.getElementById('go').onclick = runPending;
}
function runForced(){
  while(S.forced && S.forced.length){
    var sc = S.forced.shift();
    if(sc.inspect){ if(!S.flag.inspected){ S.flag.inspected = true; return inspection(); } continue; }
    S.forcedRun = true; S.cur = sc; return renderScene(sc);
  }
  return yearEnd(S.year);
}

/* ── 厂长：这一年厂里挣了多少 ── */
function bossEarly(y){
  if(S.money < -110) return 'broke';
  if(S.flag.merged) return 'merged';
  if(S.group <= 8 && y >= 6) return 'sacked';
  if((S.reportCount || 0) >= 3) return 'sacked';
  return null;
}
function bossTick(y){
  var earn;
  if(S.mode === 'cost')      earn = Math.round(22 + S.orders * 0.52 + S.morale * 0.16 - S.smoke * 0.20);
  else if(S.mode === 'tech') earn = Math.round(8 + S.orders * 0.40 + S.tech * 0.30 - S.smoke * 0.30);
  else if(S.mode === 'brand')earn = Math.round(4 + S.orders * 0.42 + S.fame * 0.34 - S.smoke * 0.24);
  else                       earn = Math.round(15 + S.orders * 0.46 + S.morale * 0.20 - S.smoke * 0.25);
  earn = Math.max(-34, Math.min(54, earn));           /* 一年挣多挣少都有个谱 */
  earn -= 5 + Math.floor(y / 4) * 3;                  /* 设备老化、人工上涨，每年都躲不掉 */
  if(S.flag.pv_own) S.smoke = pct(S.smoke - 1.2);
  if(S.flag.heat || S.flag.motor) S.smoke = pct(S.smoke - 0.5);
  S.money += earn;
  var sweep = 0;
  if(S.money > 200){ sweep = Math.round((S.money - 200) * 0.4); S.money -= sweep; }
  var quit = (S.morale < 32 && Math.random() < 0.6);
  if(quit){ S.orders = pct(S.orders - 4); }
  S.orders = pct(S.orders + 2 + (S.flag.lin_left ? 0 : 1) + (S.fame >= 56 ? 1 : 0));
  S.rival = Math.min(150, S.rival + 2.6 + (y >= 8 ? 1.2 : 0));
  var gapNow = (S.orders + S.fame) - S.rival;
  if(gapNow >= 22) S.rival = Math.min(150, S.rival + 2.4);
  if(gapNow <= -34){ S.orders = pct(S.orders - 5); S.fame = pct(S.fame - 2); S.money -= 6; }
  else if(gapNow <= -16){ S.orders = pct(S.orders - 3); S.money -= 3; }
  else if(gapNow >= 30){ S.orders = pct(S.orders + 2); }
  if(S.group < 34) S.money -= 6;
  var gap = (S.orders + S.fame) - S.rival, rl = '';
  if(gap <= -40) rl = '<p style="font-size:13.5px;color:var(--brick)">听说宏远厂又扩了一条线。他们厂长今年上了行业年会的主席台。</p>';
  else if(gap >= 40) rl = '<p style="font-size:13.5px;color:var(--dado)">宏远厂今年丢了两个客户。有几个熟练工托人来问，你们这边还招不招人。</p>';
  var note;
  if(earn <= 0) note = '一年白干。老赵把报表推过来的时候没说话，手指在亏损那一行上敲了两下。';
  else if(S.smoke > 82 && S.orders > 55) note = '单子接得不少，电费和材料也吃掉了不少。老赵说：“挣是挣了，都从指缝里漏掉一半。”';
  else if(S.smoke < 55) note = '能耗降下来之后，同样的产量，成本比前几年低了一截。这笔钱不显眼，但年年都在。';
  else if(S.orders < 42) note = '产线有一半时间是空着的。空转比停机还费钱。';
  else if(S.mode === 'tech' && S.tech >= 62) note = '技术这条路走通之后，同样的单子，别人做不了或者做不便宜。老赵最近很少念叨成本了。';
  else if(S.mode === 'brand' && S.fame >= 62) note = '有客户主动找上门来了，说是在展会上看到的。这在五年前想都不敢想。';
  else if(S.mode === 'cost') note = '成本压得很低，单子接得很满。只是每一单赚的都薄，一年到头忙下来，账上的数字不太好看。';
  else note = '不算好也不算坏的一年。';
  var extra = (sweep > 0 ? '<p style="font-size:13.5px;color:var(--ink-2)">集团年底归集了 ' + sweep
      + ' 万到财务公司账户，理由是"提高资金使用效率"。以后要用，得打报告。</p>' : '')
    + (quit ? '<p style="color:var(--brick);font-size:14px">年后走了两个老师傅。〔#zhou〕来说了一句：“厂长，工资和加班的事，得给个说法。”</p>' : '')
    + (S.group < 34 ? '<p style="font-size:13.5px;color:var(--brick)">集团把你们的资金额度往下调了一档。批复上写着"结合近年经营表现"。</p>' : '') + rl;
  return {big:earn, abs:Math.abs(earn) + ' 万',
          cap:'全年经营结余　·　账上现在 ' + Math.round(S.money) + ' 万',
          note:note, extra:extra};
}

function gfReport(){
  var got = [], miss = [];
  GF_INDICATORS.forEach(function(x){ (x.ok(S) ? got : miss).push(x.n); });
  var n = got.length, level, why;
  var dirty = S.flag.faked || S.flag.permit_fake;
  if(S.flag.shutdown || S.exposedFraud){
    level = '不予受理'; why = '有过停产整顿或数据造假被查实的记录——这一条是一票否决的，指标做得再多也没用。';
  } else if(dirty){
    var lv2 = n >= 13 ? '省级绿色工厂' : n >= 11 ? '市级绿色工厂' : n >= 8 ? '勉强够市级的线' : '还不够申报';
    level = lv2; why = '十五项里做到了 ' + n + ' 项。但你有过数据补录或口径调整——这次没被查出来，'
      + '评级也因此降了一档。真到现场复核，评审专家翻的就是那几个月的原始记录。';
  } else if(n >= 13){ level = '国家级绿色工厂'; why = '十五项里做到了 ' + n + ' 项，而且经得起现场核查。全国也没多少家。'; }
  else if(n >= 11){ level = '省级绿色工厂'; why = '十五项里做到了 ' + n + ' 项，离国家级还差几项硬指标。'; }
  else if(n >= 8){ level = '市级绿色工厂'; why = '十五项里做到了 ' + n + ' 项，够上市级的线了。'; }
  else { level = '还不够申报'; why = '十五项里只做到 ' + n + ' 项，多数是花钱能补但需要时间的那几项。'; }
  return {got:got, miss:miss, n:n, level:level, why:why};
}

function unlockBlock(){
  var all = [];
  (function walk(list){
    list.forEach(function(sc){
      if(sc.alt && sc.alt.uid) all.push({id:sc.alt.uid, t:sc.alt.because || '特殊分支'});
      (sc.o||[]).forEach(function(o){ if(o.uid) all.push({id:o.uid, t:o.because || '特殊选项'}); });
      if(sc.alt) (sc.alt.o||[]).forEach(function(o){ if(o.uid) all.push({id:o.uid, t:o.because || '特殊选项'}); });
    });
  })(R().lib);
  var seen = {}, uniq = [];
  all.forEach(function(x){ if(!seen[x.id]){ seen[x.id]=1; uniq.push(x); } });
  var got = uniq.filter(function(x){ return S.seen[x.id]; });
  return '<div class="unlk"><div class="gft">本局解锁的隐藏分支 <b>' + got.length + ' / ' + uniq.length + '</b></div>'
    + '<div class="ug">' + got.map(function(x){ return '<span class="y">' + x.t + '</span>'; }).join('')
    + (uniq.length - got.length > 0 ? '<span class="n">还有 ' + (uniq.length - got.length) + ' 个分支这一局没遇到</span>' : '')
    + '</div>'
    + '<div class="gfn">这些分支只有满足特定条件才会出现——换一种走法，你会遇到完全不同的几幕。</div></div>';
}

}

  {t:'先装表。不知道电花在哪儿，后面什么都是瞎猜', h:'<i>最不起眼</i> · 也是所有事的地基',
   r:'装完第二个月，你发现空压管路漏了三年。第五个月你发现二车间的烘干炉夜里没人的时候还在烧。这些事在装表之前谁都不知道，装完之后一个个自己冒出来。厂长后来管这叫"那笔看不见的钱"。',
   fx:{pro:6, say:4, smoke:-4, tech:5, fac:{meter:1}, flag:'my_meter'}},
  {t:'先修废水站。那是唯一能让厂子一夜关门的地方', h:'<i>不产生任何收益</i> · 但它兜着底',
   r:'停产两周才改完。那两周里你被骂了三次，老赵在会上说这是"往水里扔钱"。第九年环保督察进厂，看了排口数据就走了——那天你才知道，有些钱是买保险的，保险不出事的时候，看起来永远像浪费。',
   fx:{pro:4, risk:-2, say:2, fac:{water:1}, aff:{zhao:-2}, flag:'my_water'}},
  {t:'先动锅炉。烟囱是所有人抬头就能看见的那个', h:'<i>看得见</i> · 也最容易被表扬',

{y:2, s:'夏', who:'zhao', title:'预算被砍了一半', cost:1,
 ig:{t:'你没去争。方案照着砍完的钱做了，做出来是个半成品：装了，但没连上；能用，但没人用。这样的东西你后来在这个厂里见过很多。', fx:{pro:-3, guilt:1, tech:-2}},
 t:'小陈，你那个方案我看了，四十万。<em>集团今年给的额度就这么多，我只能批你二十。</em>你自己看是砍量还是砍质。',
 o:[
  {t:'砍量：先做一半，做透，明年再说', h:'<i>做出来的东西是能用的</i>',
   r:'你只做了主车间那一块，但做到底。第二年集团来人参观，看的就是这一块。看完他们问"其他车间为什么没有"，厂长说"没钱"。那笔钱第三年补上了。',
   fx:{pro:5, say:3, tech:4, flag:'my_half'}},
  {t:'砍质：便宜的牌子也能凑合，先把摊子铺满', h:'<i>好看</i> · 三年后你会为此加班',
   r:'铺是铺满了。第三年开始，那批便宜仪表接二连三地飘数、失联。你花了两年时间一台台换回来，没有人给这两年记过工。',
   fx:{say:2, pro:-2, tech:2, guilt:1, flag:'eng_cheap'}},
  {t:'去找厂长，把这二十万为什么不够讲清楚', h:'<i>越过老赵</i> · 有风险',
   r:'你直接进了厂长办公室，讲了四十分钟。他最后批了三十二万，末了说了句：“下次先跟老赵说，别让他从别人嘴里知道。”老赵那年冬天对你确实冷淡，但第二年他主动来问你还缺不缺钱。',
   fx:{pro:3, say:6, tech:3, aff:{zhao:-3, cz:2}, flag:'my_push'}}
 ]},

{y:2, s:'秋', who:'zhou', title:'那台机器的防护罩坏了三个月', cost:1, key:1,
 ig:{t:'这件事你听过就算了。第四年那台机器出了事，一个工人的手进去了三根指头。追责的时候翻记录，防护罩的报修单一直没人处理——上面没有你的名字，也没有任何人的名字。', fx:{risk:2, guilt:2, morale:-6, flag:'eng_injury'}},
 t:'小陈，二车间那台压片机的防护罩坏了三个月了。<em>报过两回，没人管。</em>工人自己拿铁丝绑着在用。我跟车间说过，他们说等停产检修一起弄。',
 o:[
  {t:'今天就停机修，出了事我担着', h:'<i>今天的产量没了</i> · 你替别人做了决定',
   r:'你自己关了电闸，站在机器前面等修理工来。车间主任在电话里跟你吵了十分钟。当天少出了两千片，主任的绩效扣了。三年后厂里评安全先进，没有人提这件事——它的价值就在于什么都没发生。',
   fx:{pro:4, risk:-2, morale:4, say:-2, aff:{zhou:3}, flag:'my_guard'}},
  {t:'走流程：开单、报审、排进检修计划', h:'<i>合规</i> · 也最慢',
   r:'单子开了，签了四个人的名字，排进了两个月后的检修。那两个月工人还是用铁丝绑着。修好那天老周说：“早两个月，也是这个结果，就是心里不一样。”',
   fx:{pro:2, risk:-1, say:1, flag:'my_guard'}},
  {t:'先记下来，等这批订单交完再说', h:'<i>产量要紧</i> · 你替风险签了个缓',
   r:'你在本子上记了一行。那批订单交完之后又来了下一批。这一页你后来翻到过，日期是九月十四号——你盯着那个日期看了很久，因为它离出事的那天，只差了不到两年。',
   fx:{risk:2, guilt:1, say:2}}

{y:2, s:'秋', who:'me', title:'同学群里在聊考证', cost:1,

   r:'你把书搬回宿舍，摞起来有半人高。头一年基础课没过，差七分。你在楼道里站了很久，然后回去接着看。',

{y:3, s:'春', who:'cz', title:'排污许可证要换发了', cost:1, key:1,
 ig:{t:'材料是行政上找模板凑的，报上去退了两次，第三次才过。许可证上的排放量比实际低了三成——这个数字后来一直挂在你头上，直到有人拿着它来对账。', fx:{risk:2, guilt:1, flag:'permit_loose'}},

   r:'你带着三个月的实测数据去了分局，被要求补了两次材料。最后批下来的量比行业模板高一点，但每一项都对得上。第十二年督察进厂，第一句问的就是许可证和实际排放对不对得上——那天你答得比谁都快。',
   fx:{pro:7, ind:4, risk:-2, say:2, flag:'my_permit'}},
  {t:'按模板报，跟同行一样就行', h:'<i>省事</i> · 也埋了一个你自己知道的雷',
   r:'一次过。厂长很满意，说你办事利索。这张纸后来在柜子里躺了很多年，每次有人问起排放量，你都要先在心里换算一遍——真实的是一个数，纸上的是另一个数。',
   fx:{say:3, guilt:2, risk:1, flag:'permit_loose'}},
  {t:'报低一点，给厂里留余量，反正没人逐条核', h:'<i>厂长会记你一功</i> · 直到有人来核',
   r:'厂长确实记了。年底评先进有你的名字。你把那张证复印了一份锁在自己抽屉里——你说不清为什么要这么做，但你后来庆幸自己做了。',
   fx:{say:6, guilt:3, risk:2, aff:{cz:2}, flag:'permit_fake'}}
 ]},

{y:3, s:'夏', who:'zhou', title:'危废桶堆到走道上了', cost:1,

 t:'小陈，暂存间满了，桶堆到走道上了。<em>处置公司的车两个月没来，说是他们那边额度紧。</em>再堆下去，消防都过不了。',

   r:'停了半个车间三天，花了二十四万，老赵为这事跟你在走廊上吵过一次。做完那间屋子，检查的人来了三次都是先夸这里。多年以后有人接手危废台账，翻开第一页看到的是你的字迹，格式一直没变过。',

   r:'车当天就来了，价格只有正规公司的一半。转移联单上的最终去向写着一个你没听说过的地名。三年后那家公司出了事，办案的来厂里调过一次记录——你们的单据是齐的，只是齐得让你心里发虚。',

{y:3, s:'秋', who:'lin', title:'客户问卷里那些你答不上来的题', cost:1, key:1,

 o:[

  {t:'先把能算的都算出来，熬两个通宵', h:'<i>-0 元</i> · 熬的是你自己',
   r:'你把三年的电费单、水单、危废联单全翻了一遍，手算出六项指标。交上去那天林薇说：“陈工，你这两天是不是没回家。”你说没事。这六项后来成了厂里第一份真正意义上的能耗基线。',

  {t:'按行业平均值填，反正没人来核', h:'<i>好看</i> · 单子先拿下来再说',
   r:'问卷填得很漂亮，单子拿到了。两年后那家客户来现场审核，逐项对账，对到第四项就对不上了。他们没有当场发作，只是从那以后再没追加过订单。',

{y:3, s:'秋', who:'me', title:'宿舍还是租房', cost:1,

   fx:{cash:-1.4, body:6, pro:3, flag:'my_rent'}},

{y:4, s:'春', who:'cz', title:'VOCs 设施一个月要多烧两万电', cost:1, key:1,

{y:4, s:'夏', who:'wu', title:'来了个实习生', cost:1,

   r:'他抄了一年表，第八个月自己发现了二车间烘干炉夜里空转。你把他的记录本要过来看，字比你当年工整。第九年他接了你半摊活，第十二年他能独立顶一次督察。',

   r:'他上手很快，三个月就能独立填问卷。只是有一次你发现他在一栏里填了个行业平均值，问他为什么，他说“上次不是也这么填的吗”。你没接话。',
   fx:{say:3, guilt:1, tech:2, flag:'my_wu'}},
  {t:'厂里没编制，我劝他别在这儿耗', h:'<i>对他好</i> · 你少了一双手',

 ]},

{y:4, s:'秋', who:'me', title:'在线仪表报了一次超标', cost:2, key:1,

{y:7, s:'秋', who:'me', title:'该结婚了', cost:1,
 ig:{t:'这事拖了两年。对方后来去了南方。你在厂里的时间因此更多了，多到有一年你连续七个月没请过一天假。', fx:{body:-4, pro:4}},
 t:'谈了两年了，对方家里在催。<em>办酒、彩礼、置办，算下来十来万。</em>你现在的存款你自己清楚。',
 o:[
  {t:'办，钱不够就先借一点', h:'<i>-9 万</i> · 往后几年紧一些',
   r:'酒席办在县城，摆了十八桌。老周来了，喝了三杯。厂长包了个红包，还批了七天假——那是你进厂以来最长的一次假。往后几年确实紧，但家里有个人等你，加班也变得能忍。',
   fx:{cash:-9, body:5, say:2, flag:'married'}},
  {t:'简办，两家人吃顿饭就算', h:'<i>-2.5 万</i> · 对方家里有意见',
   r:'两桌，饭馆包间。你岳母那天全程没怎么说话。这件事后来在很多个家庭场合被提起，每提一次你都要解释一次。省下来的钱在第九年买房时派上了用场。',
   fx:{cash:-2.5, say:1, flag:'married'}},
  {t:'再等等，等我把这几年熬过去', h:'<i>省钱</i> · 也有代价',
   r:'你说的"这几年"，后来变成了"这些年"。第十一年你才结婚，那时候你已经是科长了，钱不是问题了。有些东西省下来，是要用别的东西补的。',

{y:8, s:'春', who:'lin', title:'客户要来现场审核', cost:2, key:1,

 t:'陈工，那家客户要来现场审核，两天，看管理体系也看现场。<em>他们发来的清单有四十二项，我看了一半都不知道是什么。</em>下周三就来。',
 o:[
  {t:'照实准备，有什么给他们看什么', h:'<i>会被挑出问题</i> · 但都是真的',
   r:'两天下来开了十一条不符合项，最重的一条是危废台账缺三个月。客户的审核组长临走说了句：“你们厂有个好处——问什么答什么。”整改完成后他们追加了两条产线的订单。',
   fx:{pro:5, ind:6, orders:6, risk:-1, aff:{lin:4}, flag:'my_audit'}},
  {t:'突击一周，把现场和台账都补齐再让他们进', h:'<i>七天不睡</i> · 效果最好也最累',

   fx:{pro:4, ind:4, orders:8, guilt:2, body:-6, aff:{lin:5}}},
  {t:'把审核清单反过来当整改清单，用半年慢慢做', h:'<i>这次会难看</i> · 换一份长期的底子',

   uid:'eng_turn_audit',

{y:8, s:'夏', who:'zhao', title:'节能技改有一笔补贴可以申报', cost:1,
 ig:{t:'申报期错过了。第二年政策收紧，同样的项目只能拿到原来的六成。老赵提过一次，之后再没提。', fx:{say:-2}},
 t:'小陈，市里有一笔节能技改补贴，<em>按投资额的百分之十五补，我们前两年做的那几项都够格。</em>材料要节能量测算报告，这个只有你会做。',
 o:[
  {t:'照实测算，能报多少报多少', h:'<i>-0 元</i> · 数字经得起核查',
   r:'你按实际运行数据算出来的节能量比预期低一些，补贴拿到四十一万。第二年市里抽查了三家企业的申报材料，你们是唯一一家原始数据调得出来的。此后凡是有专项资金，主管部门都会先想到这个厂。',

  {t:'按设备铭牌算，数字好看一点', h:'<i>多拿十几万</i> · 铭牌不是实测',
   r:'补贴拿到五十八万。厂长很高兴，年终给了你一笔奖金。第十二年有一次专项审计调阅了这份材料，问节能量的原始记录在哪里，你花了三个晚上"整理"了一份出来。',
   fx:{cash:1.5, money:58, say:5, guilt:3, aff:{zhao:5}, flag:'sub_loose'}},
  {t:'不报。我们那几项达不到申报口径', h:'<i>老赵会跳脚</i>',
   r:'你把口径逐条对了一遍，确实差两项。老赵在会上说了句"陈工太老实"。这件事在厂里传成了一个笑话，但第十二年那次审计，隔壁两家企业被追回了资金，你们没事。',
   fx:{pro:3, ind:3, say:-3, aff:{zhao:-4}, flag:'my_nosub'}}

{y:8, s:'秋', who:'cz', title:'厂里想成立能源科', cost:2, key:1,
 ig:{t:'这事不了了之。能源的活还是散在各个部门，你还是那个"什么都懂但什么都不管"的人。', fx:{say:-4}},
 t:'我想成立个能源科，把能源、环保、计量都归进去，<em>科长的位子给你。</em>丑话说前头：编制两个人，活是现在的三倍，工资涨八百。',
 o:[
  {t:'接。总算能自己排事情的顺序了', h:'<i>+1 份精力</i> · 从此你也是"管理"',
   r:'挂牌那天你搬进了一间十二平米的办公室。第一件事是把墙上那张自评清单挂过去。管人这件事你学得很慢，头一年跟两个下属都吵过。但从这一年起，很多事你不用再求别人批。',
   fx:{cash:1, say:10, pro:2, flag:'eng_lead'}},
  {t:'接，但要求编制给三个人', h:'<i>谈条件</i> · 可能谈崩',
   r:'你跟厂长磨了两周，最后给了三个。多出来那一个人后来专职做数据，第十一年集团来做碳盘查，我们是唯一一家能当场调出五年逐月数据的厂。厂长事后说：“那个人你要对了。”',
   fx:{cash:1, say:12, pro:3, tech:5, aff:{cz:-1}, flag:'eng_lead'}},
  {t:'不接。我想把技术做深，不想去开会', h:'<i>纯粹</i> · 也从此没有话语权',
   r:'厂长找了别人。那个人做事四平八稳，凡事先问上面。你从此可以安心做技术了，代价是每一个方案都要经他的手往上递。第十一年你有一个很好的方案，递上去三个月没有回音。',
   fx:{pro:8, ind:4, say:-8, flag:'eng_pure'}}
 ]},

{y:9, s:'春', who:'me', title:'第一次碳核查进厂', cost:2, key:1,
 ig:{t:'核查是行政接待的。数据东拼西凑，核查员写了三条"数据质量存疑"。这三条跟着这个厂进了往后每一年的核查报告。', fx:{guilt:1, ind:-3, flag:'ccheck_bad'}},
 t:'省里安排的温室气体排放核查，明天进厂。<em>要五年的燃料消耗、电力消耗、产量数据，逐月，还要原始凭证。</em>你手里有多少？',
 o:[
  {t:'把这些年攒的原始记录都搬出来', h:'<i>要看你之前记没记</i>',
   need:function(s){ return !!s.flag.my_log || !!s.flag.my_meter || !!s.flag.my_base; },
   because:'这些年你一直在记原始数据',
   uid:'eng_carbon_ok',
   r:'你推了一辆平板车进会议室，上面是五年的台账、电费单、燃气单和产量报表。核查组两个人看了一天半，走的时候说了句：“我们一年跑六十家厂，能这样摆出来的不到五家。”这份核查报告后来成了厂里第一份可信的碳基线。',
   fx:{pro:8, ind:8, tech:6, say:5, fac:{meter:1}, flag:'my_carbon'}},
  {t:'能凑多少凑多少，剩下的按行业系数算', h:'<i>过得去</i> · 但不是你们厂的数',
   r:'核查通过了，报告上有两条"建议加强数据管理"。这两条你后来自己去改，花了两年才把逐月数据补成体系。早知道要补，当初何必凑。',
   fx:{pro:3, tech:2, guilt:1}},
  {t:'借这次核查，顺手把厂里的数据体系建起来', h:'<i>两个月</i> · 一次做对',
   r:'你跟核查组要了他们的数据清单，照着建了一套逐月台账，从此每月固定归档。第十三年碳配额有缺口的时候，正是这套数据帮厂里省下了一大笔——因为你们能证明产量涨了。',
   fx:{pro:7, ind:5, tech:8, say:4, body:-5, fac:{meter:1}, flag:'my_carbon'}}

{y:9, s:'夏', who:'me', title:'第三方检测公司在挖你', cost:2, key:1,

 o:[

  {t:'不去，但跟他们做技术合作', h:'<i>厂里未必允许</i> · 一只脚踩在外面',

{y:9, s:'秋', who:'wu', title:'小吴翻出了一份旧报告', cost:1,

 t:'陈工，我整理档案的时候翻到一份几年前的报告。<em>里面有个数，跟同一年的原始记录对不上。</em>我怕是我算错了……您看看？',
 o:[
  {t:'告诉他实话：那个数当年是调过的', h:'<i>难堪</i> · 但这孩子不会学坏',
   r:'你把当年的情况原原本本讲了，包括是谁要求的，包括你为什么答应。小吴听完很久没说话，最后说：“陈工，那我以后遇到这种事怎么办。”你说：“先想清楚你能不能扛，扛不住就来找我。”从那以后他真的来找过你两次。',
   fx:{pro:2, ind:5, guilt:-3, say:-1, flag:'my_confess'}},
  {t:'带着他把这份报告重新算一遍，改过来', h:'<i>要惊动几个人</i> · 也是把账平了',
   r:'你重新算了，写了一份更正说明，附在原报告后面归档。厂长知道后皱了眉，但没拦你。第十三年那次审计翻到这份更正说明，审计组的人说：“主动改过的，我们一般不再往下追。”',
   fx:{pro:4, ind:6, guilt:-4, say:-3, aff:{cz:-2}, flag:'my_fixdoc'}},
  {t:'跟他说是他算错了', h:'<i>轻松</i> · 你教了他一件事',
   r:'他"哦"了一声，把报告放回去了。这件事没有后续，只是从那以后，他遇到对不上的数字，第一反应变成了"大概是我算错了"。你在他身上看见了七年前那个自己。',
   fx:{say:2, guilt:3, ind:-3}}
 ]},

{y:9, s:'秋', who:'zhou', title:'老师傅不肯用新流程', cost:1,
 ig:{t:'新流程贴在墙上，没人照着做。三个月后你把那张纸摘了。这是你在这个厂第一次主动放弃一件对的事。', fx:{tech:-3, say:-3, guilt:1}},
 t:'小陈，你那个新的换料流程，二车间的老师傅们不肯用。<em>他们干了二十年，说照你那个来，一个班少出三百公斤。</em>话不好听，但他们不是故意跟你过不去。',
 o:[
  {t:'到车间跟他们一起干一个班', h:'<i>一个八小时的班</i> · 你会脏一身',
   r:'你跟着干了一个班，发现你的流程里有两步在实际操作上根本站不住——图纸上顺手的动作，人站在那个位置够不着。你改了两处，产量没降，安全动作留下了。带头反对的老师傅后来成了这个流程最坚决的执行者。',
   fx:{pro:7, tech:5, morale:6, say:3, body:-3, aff:{zhou:4}, flag:'my_shopfloor'}},
  {t:'发文，考核挂钩，不执行扣钱', h:'<i>见效快</i> · 也把人推远',
   r:'一个月就全用上了。产量确实降了两个点，三个月后自己爬回来了。只是从那以后，车间里的事没有人再主动告诉你，你要什么，得自己去问。',
   fx:{tech:4, say:5, morale:-6, aff:{zhou:-3}}},
  {t:'先让老周去说，我在后面', h:'<i>借力</i> · 也把责任推给了他',
   r:'老周去说了，说通了。这件事办成了，功劳记在你头上。半年后老周提了一句"上次那事儿你欠我个人情"，你才意识到你确实欠了。',
   fx:{tech:3, say:2, aff:{zhou:-2}}}
 ]},

{y:10, s:'春', who:'cz', title:'屋顶那两万平米', cost:2, key:1,

 t:'有家能源公司来推屋顶光伏，说是他们投资，我们只管用电，电价打八折。<em>另一个方案是我们自己出五十八万，二十五年的电都是自己的。</em>你怎么看？',
 o:[
  {t:'自己投。二十五年的账，算得过来', h:'<i>厂里出 58 万</i> · 你要为这笔钱背书',
   r:'你做了一份二十五年的现金流测算，附了三种电价情景。老赵挑了两个礼拜的毛病，最后签了。并网那天年轻人开始管屋顶叫"发电站"。第八年回本，之后每一度电都是白捡的。',
   fx:{pro:6, say:5, smoke:-11, money:-58, morale:4, fac:{roof:1}, flag:'my_pv'}},
  {t:'让他们投。我们不出钱，也不担风险', h:'<i>省事</i> · 二十五年的好处是别人的',
   r:'合同签了二十五年。电价确实便宜了两成，屋顶的防水也是他们做的。只是每年算总账的时候，你都会算一遍"如果当初自己投"——那个数字一年比一年扎眼。',
   fx:{smoke:-7, say:2, fac:{roof:1}}},
  {t:'先修防水。屋顶还在漏，谈什么发电', h:'<i>不显眼</i> · 但顺序是对的',

   fx:{pro:5, ind:3, smoke:-9, money:-58, fac:{roof:1}, flag:'my_pv'}}

 o:[
  {t:'跟他一起把方案改成分三年做的版本', h:'<i>费你两个晚上</i> · 让它活下来',
   r:'你们把四十万拆成三笔，第一笔八万，做最容易见效的那段。第一年省下的水费和电费，正好够第二笔。第三年做完的时候，小吴说：“陈工，原来还能这么干。”你说：“我当年没人教我，是自己撞出来的。”',

  {t:'照实告诉他：今年没钱，明年优先', h:'<i>诚实</i> · 也可能只是好听的推脱',
   r:'你说得很直接，还把额度表给他看了。明年你真的把这笔钱排在了第一位。他后来说，让他留下来的不是那笔钱，是你给他看了那张表。',
   fx:{say:3, tech:4, ind:2, smoke:-2, flag:'my_teach'}},
  {t:'退回去，让他先把数据做扎实再说', h:'<i>标准</i> · 也是你当年最恨的那句话',
   r:'你在退回意见上写了"测算依据不足"。写完你盯着这五个字看了一会儿——七年前有人在你的方案上写过一模一样的五个字。你把批注删了又写，最后还是发了出去。',
   fx:{say:2, tech:-2, guilt:2, ind:-2}}
 ]},

{y:14, s:'夏', who:'lin', title:'林薇要走了', cost:1,
 ig:{t:'她走得很安静。交接会上你才知道，这些年客户那些技术问题，有一半是她替你挡回去的。', fx:{orders:-5, ind:-2, flag:'lin_left'}},

 o:[
  {t:'因为我编不出来，也不想编', h:'<i>老实话</i>',
   r:'她笑了：“我当时觉得你傻。后来才知道，那是我这些年最好卖的一句话——‘我们的供应商说不知道的时候，是真的不知道’。”她走后你才明白，那份难看的问卷，是你们俩一起挣来的信用。',
   fx:{ind:5, orders:2, aff:{lin:3}, flag:'lin_left'}},
  {t:'因为我知道那些数字迟早有人来对', h:'<i>算计</i> · 也是实话',
   r:'她点点头："你比我想的现实。"这句话不算夸奖也不算贬低。她走了以后，接手的小周问过你同样的问题，你给的是同一个答案。',
   fx:{ind:3, say:2, flag:'lin_left'}},
  {t:'说不清。当时就觉得不该那么填', h:'<i>诚实到有点笨</i>',
   r:'她看了你一会儿，说："陈工，这十四年你没怎么变。"你不知道这是好话还是坏话。她走后你在办公室坐了很久，然后翻出了那份问卷的复印件——第一页角上，她当年用铅笔写了两个字：真的。',
   fx:{ind:6, aff:{lin:4}, flag:'lin_left'}}
 ]},

   fx:{pro:5, ind:4, say:6, aff:{zhao:5}, flag:'my_ledger'}},
  {t:'算，但把没算得清的那部分也写上去', h:'<i>更难看</i> · 也更像真的',
   r:'你在最后一栏写了"无法量化：三次没有发生的处罚、两次没有丢掉的客户、一个没有受伤的工人"。老赵盯着那一行看了半天，说：“这一栏，才是你们这行最值钱的东西。”',
   fx:{pro:4, ind:7, say:5, aff:{zhao:6}, flag:'my_ledger'}},
  {t:'太忙了，让下面的人整一份出来', h:'<i>省事</i>',
   r:'交上去的表数字对得上，但看不出所以然。老赵翻了两页就合上了，说了句"辛苦了"。这是他跟你说的最后一句正经话。',

{y:15, s:'春', who:'cz', title:'厂长要调走了', cost:2, key:1,
 ig:{t:'厂长走的时候你在外地。他留了一个信封在你桌上，里面是那张十年前的自评清单的复印件，最后一项旁边他画了个勾。', fx:{say:-3}},

 o:[
  {t:'第四年那次，VOCs 设施该早点说死', h:'<i>把最难的话说出口</i>',
   r:'他沉默了一会儿，说："那年你要是把话说得再死一点，我大概会听。"你说未必。他说："也是。"两个人都笑了，笑完谁也没再说话。他走的时候把办公室钥匙留给了你。',

  {t:'第一年那次，我该更早学会怎么让人听懂', h:'<i>回到起点</i>',
   r:'他说："你现在会了。"你说："花了十五年。"他说："那不算慢。我见过一辈子没学会的。"',

  {t:'什么都不改。每一步都是当时能做到的', h:'<i>坦然</i> · 也可能是不愿再想',

{y:15, s:'春', who:'me', title:'集团在问你要不要动一动', cost:2, key:1,

  {t:'都不去。我就想把技术这条线做到底', h:'<i>没有再往上</i> · 也没有再往回',
   r:'你继续做你的技术负责人。第十六年有人问起你为什么不上去，你说了一句自己都觉得有点矫情的话："上去了就没人蹲在管子底下看了。"说完你自己笑了，但那是真话。',

{y:15, s:'夏', who:'zhou', title:'最后一次签字', cost:1,

 ]},

{y:15, s:'秋', who:'me', key:1,
 t:'十五年过去了。<em>办公室墙上那张自评清单，你数了数还剩下几项没划。</em>抽屉里有老周那个本子、第三年那份九栏空白的问卷、还有一沓从来没交上去过的方案。收拾东西的时候，接班的人问你：有什么要交代的吗？',
 o:[
  {t:'把那张清单留在墙上，剩下的自己划', h:'<i>把没做完的事交出去</i>',
   r:'你没有摘那张纸。它在那面墙上挂了十年，纸边已经卷了。接班的人第二年划掉了一项，第四年又划掉一项。他后来跟人说，刚来的时候不懂这张纸是什么，两年以后才明白，那是一个人十几年的账。',
   fx:{ind:5, flag:'fin_list'}},
  {t:'把老周那个本子传下去', h:'<i>那十九条</i>',
   r:'你把本子交给他，说："里面有六条写着‘这么干是不对的，但当年只能这么干’。你看看现在还有几条是这样。"他翻了一遍，抬头说："还有三条。"你说："那就还有三条要改。"',
   fx:{ind:4, morale:4, flag:'fin_book'}},
  {t:'什么也不交代，让他自己撞', h:'<i>你当年就是这么过来的</i>',
   r:'你说："没什么好交代的，都在柜子里。"他点点头。你走出办公室的时候回头看了一眼，那间十二平米的屋子里，堆着十五年。有些东西是交不出去的，只能让下一个人自己长出来。',
   fx:{pro:2, ind:-2, flag:'fin_none'}}
 ]},

{y:8, s:'秋', who:'me', title:'安全环保月的展板', cost:1,

{y:12, s:'秋', who:'me', title:'宏远厂出事了', cost:1,

{y:4, s:'夏', who:'wk', title:'老乡说南方厂里给得多', cost:1,

  {t:'不去。这儿有社保，有师傅', h:'<i>少挣</i> · 但根扎着',

   fx:{favor:4, skill:3, aff:{zhou:2}}},
  {t:'不去，但跟厂里提一提待遇', h:'<i>可能没用</i> · 也可能被记住',
   r:'你跟老周说了这事。他跟车间提了，车间跟人事提了，最后你那个岗的岗位系数调了半级，一个月多两百。老周说："会哭的孩子有奶吃，但别天天哭。"',
   fx:{cash:0.24, favor:2, aff:{zhou:2}}}
 ]},

{y:6, s:'春', who:'jun', title:'夜里那台风机', cost:1, key:1,

 ]},

{y:7, s:'秋', who:'zhou', title:'加班费改成计件', cost:1,
 ig:{t:'新办法照常执行。头三个月大家拼命干，产量涨了一成半；半年后单价下调，产量还得保持。这个循环后来重复了三次。', fx:{cash:-0.3, body:-6, morale:-4}},
 t:'厂里要改分配办法，<em>加班费取消，改成计件加提成。</em>算下来干得快的多拿，干得慢的少拿。车间里吵翻了，主任让各班组报意见。',
 o:[
  {t:'支持。我干得快，我不吃亏', h:'<i>+0.8 万／年</i> · 也把老的人卖了',
   r:'新办法执行以后你的收入涨了两成。班组里五十岁往上的几个人收入直接掉了三成，其中两个第二年办了内退。有一次在食堂，其中一个人端着饭走开了。',
   fx:{cash:0.8, body:-7, mates:-9, favor:6, flag:'wk_piece'}},
  {t:'反对。这是变相降加班费', h:'<i>顶回去</i> · 主任会记住',
   r:'你把两种算法的数摆出来，证明按新办法算，平均下来是降的。老周把你的意见原样报了上去。厂里改了口径，保留了基础加班费。这件事你在车间里得了人心，在人事那儿挂了号。',
   fx:{mates:10, favor:-7, morale:6, flag:'wk_object'}},
  {t:'提个折中：老工人给三年过渡期', h:'<i>不痛快</i> · 但可能通过',
   r:'厂里采纳了。过渡期三年，老工人按孰高原则算。这个方案谁都不满意，但谁都没有输。老周说了句："你这脑子，不当官可惜了。"',
   fx:{cash:0.3, mates:6, favor:4, morale:4, flag:'wk_bridge'}}
 ]},

{y:8, s:'春', who:'jun', title:'大家要去找厂长', cost:2, key:1,
 ig:{t:'那天你没去，也没说不去，只是排了个班躲开了。事情后来不了了之，工资涨了三十块。去了的那十几个人，有三个在年底的考核里拿了"基本称职"。', fx:{mates:-6, favor:2, morale:-4}},
 t:'三年没涨工资了，物价涨成什么样你也知道。<em>咱们车间十几个人商量好了，明天一早集体去厂长办公室。</em>人越多越安全。你去不去？',
 o:[
  {t:'去。这事得有人出面', h:'<i>厂里会记名字</i>',
   r:'二十一个人站在办公楼下面。厂长下来跟大家谈了四十分钟，答应第二季度调整。工资后来涨了一百二。人事的记录里，那天到场的人都有名字。第十三年优化名单的时候，那份名单被翻出来对过一次。',
   fx:{cash:0.6, mates:14, favor:-14, morale:8, flag:'wk_strike'}},
  {t:'去，但先私下跟老周通个气', h:'<i>留了余地</i>',
   r:'老周提前把情况报给了厂长，第二天的见面就变成了"座谈"，气氛缓和得多。工资涨了一百，比预期少。有人说你事先通风报信，也有人说要不是你，事情早闹大了。两种说法在车间里一直并存。',
   fx:{cash:0.5, mates:2, favor:6, morale:4, aff:{zhou:3}, flag:'wk_middle'}},
  {t:'不去，还把这事报给了车间主任', h:'<i>+0.6 万</i> · 这是最实在的一条路',
   r:'主任提前做了准备，第二天那件事没闹起来。年底你的绩效评了优，还进了后备名单。车间里没有人当面说什么，只是从那以后，班前会上你一开口，就没人接话了。这个状态持续了三年多。',
   fx:{cash:0.6, favor:16, mates:-22, morale:-8, flag:'wk_scab2'}}
 ]},

{y:8, s:'夏', who:'wk', title:'买房', cost:2,
 need:function(s){ return !!s.flag.wk_kid; },
 ig:{t:'房子的事一直拖着。你们在厂区租的房子住到孩子上小学，第三次涨租那天，你爱人在楼道里坐了很久。', fx:{cash:1.2, flag:'wk_nohouse'}},
 t:'孩子过两年要上学，<em>城里的房子首付三十五万，厂区边上的十八万，学区差一大截。</em>你现在存款你自己清楚，公积金一个月八百。',
 o:[
  {t:'咬牙买城里的', h:'<i>-18 万</i> · 二十年月供',
   r:'首付东拼西凑，欠了亲戚十一万。往后十几年，你不敢辞职，不敢生病，也不敢在厂里跟任何人硬顶。这套房子是你这辈子做过的最正确也最沉重的决定。',
   fx:{cash:-18, body:-4, mates:-3, flag:'wk_house_city'}},
  {t:'买厂区边上的，够住就行', h:'<i>-9 万</i> · 孩子上片区小学',
   r:'房子小，但没什么压力。孩子在厂区小学读到六年级。这个决定在往后十年里让你比很多人自由——第十三年那次优化，你是车间里少数几个敢说"大不了不干了"的人。',
   fx:{cash:-9, flag:'wk_house_near'}},
  {t:'不买。租着，钱攒着', h:'<i>攒得住</i> · 也随时可能被赶',
   r:'你们搬了三次家。每一次搬家孩子都要转学。第十二年房东卖房，你们在两周之内搬到了更远的地方，那年冬天孩子上学要坐四十分钟公交。',
   fx:{cash:1.2, body:-3, flag:'wk_nohouse'}}
 ]},

{y:8, s:'秋', who:'zhou', title:'有人来问车间夜里的事', cost:1,
 ig:{t:'你没被问到。查了半个月，最后不了了之，说是"举报内容不实"。车间里后来没有人再提这件事。', fx:{risk:1, morale:-3}},
 t:'分局来人了，说是接到举报，问夜里排放的事。<em>他们要单独找几个上夜班的谈，名单里有你。</em>厂长的意思是，"照实说，但别乱说"。',
 o:[
  {t:'照实说，我看见什么说什么', h:'<i>厂里会知道是谁说的</i>',
   r:'你说了三次风机被关的事，具体到日期。分局据此查了运行记录，厂里被罚了十二万，责令整改。车间主任找你谈了话，说得很客气，但从那以后你调岗、评级都没了下文。整改之后，夜班的空气确实好了很多。',
   fx:{favor:-15, mates:4, risk:-3, morale:5, money:-12, flag:'wk_whistle'}},
  {t:'按厂里教的口径说', h:'<i>安全</i>',
   r:'你说得滴水不漏。事情压了下去。回车间的路上你碰见阿军，他问你说了什么，你说"没什么"。这三个字后来在你们之间横了很久。',
   fx:{favor:8, mates:-6, risk:1, guilt:0, flag:'wk_cover'}},
  {t:'只说自己那个岗的事，别的不知道', h:'<i>不撒谎，也不多说</i>',
   r:'你只讲了自己岗位上的操作，别的一概说不清楚。这是实话，也是选择。分局没有查出什么。厂里觉得你"懂事"，工友觉得你"没卖人"。两边都过得去，只有你自己知道，你那天回避了什么。',
   fx:{favor:4, mates:2, risk:1}}
 ]},

{y:9, s:'春', who:'zhou', title:'产线要换新的了', cost:2, key:1,
 ig:{t:'新线装上那天你才知道。培训名单上没有你，你被调去了辅助岗，工资少了八百。你那身手艺在新设备上用不了三成。', fx:{skill:-12, cash:-0.9, favor:-6, flag:'wk_obsolete'}},
 t:'厂里定了，一号线整条换新，明年三月上。<em>新线是自动的，一个班原来八个人，以后三个。</em>培训名额车间给了五个，报了七个人。你自己掂量。',
 o:[
  {t:'去争这个名额，找老周说，找主任说', h:'<i>要抢别人的位子</i>',
   r:'你去了三趟，最后一个名额是你的。挤掉的是干了十九年的老陆。培训两个月，你学得很吃力，晚上背参数背到凌晨。上线那天你是三个人里最稳的那个。老陆调去了包装，见到你还是打招呼，但不说别的了。',
   fx:{skill:14, favor:8, mates:-8, cash:0.6, tech:3, flag:'wk_newline'}},
  {t:'不争。让给老陆，他年纪大了不好转', h:'<i>你的手艺会作废</i>',
   r:'老陆去了，学得很吃力，但学下来了。你被调去了老线，两年后老线也停了。第十三年优化名单出来，你在上面，老陆不在。他来找过你一次，什么也没说，放下两瓶酒就走了。',
   fx:{skill:-9, mates:12, favor:-6, flag:'wk_obsolete'}},
  {t:'自己啃。名额没了，我自己学', h:'<i>没人教</i> · 也没有那张纸',
   r:'你把新线的操作手册借出来复印了一份，晚上自己看，白天去现场蹲着看别人干。半年后你会的东西不比培训过的人少，但人事的名单里没有你。第十一年一次故障，全厂只有你一个人当场判断出是哪个传感器——那天之后，名单上才有了你。',
   fx:{skill:9, body:-8, favor:2, flag:'wk_selflearn'}}
 ]},

{y:9, s:'夏', who:'zhou', title:'我要退了，接班的人得定', cost:2, key:1,
 ig:{t:'老周退了，车间主任从别的班组提了一个人上来。新主任规矩多，人也生，很多事得重新学着相处。', fx:{favor:-4, morale:-3, flag:'zhou_quit'}},
 t:'我干了二十六年，明年就退。<em>车间这摊，我想推一个人上来。</em>论手艺你够，论人缘你也够，但我得问你一句：你想要吗？',
 o:[
  {t:'想。这些年我等的就是这个', h:'<i>+1.8 万／年</i> · 也从此站到对面',
   r:'老周把车间的每一件事跟你交代了三个月，包括哪些人不能得罪、哪些账不能碰。上任第一年你就得罚人、得排优化名单、得在会上替厂里说话。有一次班组的人在食堂看见你，把桌子换了。',
   fx:{cash:1.8, favor:14, mates:-8, skill:2, flag:'wk_boss', aff:{zhou:4}}},
  {t:'不想。我干技术就行', h:'<i>清爽</i> · 位子给了别人',
   r:'老周叹了口气，说了句："那我推别人了。"新主任上任第一年就跟你不对付。你手艺再好，排班、评级、名额都在别人手里。这一点你后来体会得很深。',
   fx:{skill:6, mates:6, favor:-8, flag:'wk_notboss'}},
  {t:'我想，但我不想当那种主任', h:'<i>老周会笑</i>',
   r:'老周笑了："哪种？"你说不出来。他说："干几年你就知道，这个位子上没有你想的那种。"你还是接了。三年后你在一件事上顶住了厂里，代价是那年的考核只拿了"称职"。你觉得值。',
   fx:{cash:1.8, favor:10, mates:-3, morale:4, flag:'wk_boss', aff:{zhou:5}}}
 ]},

{y:9, s:'秋', who:'wk', title:'体检报告', cost:1,
 ig:{t:'报告塞在柜子里。往后几年，那几项一年比一年往下走，你都没有再看过。', fx:{body:-10}},
 t:'厂里的职业健康体检，<em>你的报告上有两项异常，其中一项写着"建议脱离接触岗位复查"。</em>脱离接触，意味着调岗，意味着津贴没了。',
 o:[
  {t:'去复查，该调岗就调岗', h:'<i>-0.36 万／年</i>',
   r:'复查结果是早期改变，可逆。你调去了非接触岗，津贴没了，一个月少三百。三年后再查，指标恢复了。这三百块钱一个月，你换回了大概十年。',
   fx:{cash:-0.36, body:14, skill:-3, favor:-2, flag:'wk_transfer'}},
  {t:'不复查。查出来就得调岗，钱少一大截', h:'<i>+0.36 万／年</i>',
   r:'你把报告收了起来。往后几年那两项一直没好，第十四年变成了三项。医生问你什么时候开始的，你说记不清了——其实你记得很清楚，是第九年秋天。',
   fx:{cash:0.36, body:-12, flag:'wk_hide_health'}},
  {t:'拿着报告去找陈工，问是不是防护有问题', h:'<i>惹麻烦</i> · 也可能救一批人',
   r:'陈工照着你的报告查了整个岗位的防护，发现新风系统的过滤器两年没换。换完之后，第二年那个岗的体检异常率降了一半。你自己的指标也稳住了。有几个老师傅私下跟你说过谢谢。',
   fx:{body:8, mates:8, favor:-3, risk:-1, morale:5, aff:{chen:4}, flag:'wk_health_fix'}}
 ]},

{y:10, s:'春', who:'jun', title:'第一次要罚自己人', cost:2, key:1,
 need:function(s){ return !!(s.flag.wk_lead || s.flag.wk_boss); },
 ig:{t:'你把这事压了下去。第二个月同样的违规又出现了三次，第三个月厂里通报到了车间，扣的是你的绩效。', fx:{favor:-8, cash:-0.5, risk:1}},
 t:'老陆今天又把联锁短接了，被安全员逮个正着。<em>按规定要扣三百，通报到全厂。</em>他上个月刚交了他儿子的学费。这事儿你现在说了算。',
 o:[
  {t:'照规定扣，通报', h:'<i>规矩立住了</i> · 人心散一点',
   r:'你扣了，也通报了。老陆当着全班的面说了句"行，你现在是官了"。往后半年班组里的气氛一直是僵的。但违规的确实少了，第十二年督察进厂查到这条，你们车间是唯一没问题的。',
   fx:{favor:8, mates:-10, risk:-2, morale:-4, flag:'wk_strict'}},
  {t:'不扣，私下警告，帮他把这事压下去', h:'<i>工友认你</i> · 你担着',
   r:'你跟安全员打了招呼，说是自己教的不到位。老陆没被扣钱。这件事班组里的人都知道，你在他们那儿的分量从此不一样了。代价是往后两年，凡是你说的规矩，大家心里都会先掂量一下"是不是真的要执行"。',
   fx:{mates:12, favor:-6, risk:2, flag:'wk_shield'}},
  {t:'扣钱，但自己掏钱补给他', h:'<i>-0.03 万</i> · 两头都想要',
   r:'规矩立住了，钱也补上了。老陆收了钱，什么也没说。半年后他跟别人说起这事，用的词是"假仁假义"。这话传到你耳朵里的时候，你正在给另一个人写检查。',
   fx:{cash:-0.03, favor:6, mates:2, risk:-1}}
 ]},

{y:10, s:'夏', who:'wk', title:'宏远来挖人', cost:2, key:1,
 ig:{t:'那个电话你没回。宏远后来又找过一次别人，走的是跟你同一批进厂的两个。他们现在的工资是你的一倍半。', fx:{cash:0.2, mates:-2}},
 t:'对门宏远新上的产线要人，<em>开的条件是月薪高四成，签三年，岗位是设备操作主管。</em>他们的人说，就冲你在红星这些年的手艺。你今年三十一。',
 o:[
  {t:'去。这厂欠我的，别人给了', h:'<i>换一条路</i> · 故事在这里分岔',
   r:'你交了辞职报告。老周找你谈了一次，说的是"再等等"。你说等不动了。走的那天，老周送你到大门口。',
   fx:{flag:'wk_leave10'}},
  {t:'不去。工龄、社保、房子都在这儿', h:'<i>少挣四成</i>',
   r:'你算了三个晚上，最后没去。理由说给别人听是"稳定"，说给自己听是"我怕"。这两个理由都对。往后五年你偶尔会想起这件事，尤其是发工资那几天。',
   fx:{favor:3, skill:3, aff:{zhou:2}, flag:'wk_stay10'}},
  {t:'拿这个去跟厂里提条件', h:'<i>涨薪</i> · 也从此被看作会跑的人',
   r:'厂里给你调了一级岗位系数，一个月多六百。人事那位跟你说："厂里是有感情的。"这句话你听得懂。往后每次评先进、报名额，你都排在别人后面——因为你曾经准备走。',
   fx:{cash:0.72, favor:-6, flag:'wk_bargain'}}
 ]},

{y:12, s:'夏', who:'wk', title:'孩子上小学', cost:1,
 need:function(s){ return !!s.flag.wk_kid; },
 ig:{t:'孩子进了片区里最普通的一所。你爱人为这事跟你冷战了一个月。那一个月你上了十一个夜班。', fx:{body:-5, cash:0.4}},
 t:'孩子今年上小学。<em>厂区小学一个班五十六个人，城里的三十八个。</em>要转过去得有房子或者交借读费，一年八千。',
 o:[
  {t:'交借读费，去城里读', h:'<i>-0.8 万／年</i> · 接送靠你爱人',
   r:'交了六年。这六年家里没添过一件像样的东西。孩子成绩不错，考上了市里的高中。你去开家长会那次，是你这十几年里唯一一次为了自己家的事请假。',
   fx:{cash:-0.8, body:-3, flag:'wk_school_city'}},
  {t:'就在厂区读，我小时候也这么过来的', h:'<i>省下一大笔</i>',
   r:'孩子在厂区小学读完了六年。你爱人提过很多次，你每次都说"再看看"。这件事后来成了家里一个不能碰的话题。它跟钱有关，但又不完全是钱的事。',
   fx:{cash:0.4, mates:2, flag:'wk_school_near'}},
  {t:'调白班，自己接送', h:'<i>-0.36 万／年</i> · 也少了很多机会',
   r:'你申请调了白班。津贴少了，加班机会也少了。但那六年，孩子每天放学是你去接的。第十六年他跟人提起你，说的第一件事是"我爸每天来接我"。',
   fx:{cash:-0.36, body:6, favor:-4, skill:-2, flag:'wk_dayshift2'}}
 ]},

{y:11, s:'春', who:'jun', title:'新来的年轻人不服管', cost:1,
 need:function(s){ return !!(s.flag.wk_lead || s.flag.wk_boss); },
 ig:{t:'那几个年轻人干了半年就走了两个。剩下的一个学得七零八落，第十三年一次误操作烧了一台泵。', fx:{skill:-2, morale:-4, risk:1}},
 t:'新来那几个九八年、二〇〇〇年的，<em>让干活拿手机拍视频，说要发网上。</em>说他两句还回嘴，说"这活多少钱，值得这么拼？"你当年可不敢这么说话。',
 o:[
  {t:'按老规矩来，该说说该罚罚', h:'<i>立威</i> · 他们可能直接走人',
   r:'两个月走了两个，剩下一个老实了。车间里的老人说你有魄力。第十三年招工，来的人比往年少了三成——这不全是你的事，但你那两个人确实是被你说走的。',
   fx:{favor:6, mates:-4, morale:-5, skill:-2}},
  {t:'把他们当年轻时候的自己看，好好教', h:'<i>费劲</i>',
   r:'你带他们，也听他们说话。有一个后来说："师傅，我以前觉得这活没意思，现在觉得还有点门道。"三年后他考了技师证。这个厂里能教出人的人不多，你是其中一个。',
   fx:{skill:3, mates:8, morale:8, body:-3, favor:3, flag:'wk_teach'}},
  {t:'跟他们讲清楚这活的钱和风险，让他们自己选', h:'<i>诚实</i> · 走的可能更多',
   r:'你把工资构成、职业健康、往上走的路都摊开讲了一遍。三个人走了两个，剩下的那个干到了第十六年，成了班组的骨干。你说："我不想再看见有人干了十年才发现自己不想干。"',
   fx:{mates:6, morale:5, skill:-2, favor:-3, flag:'wk_honest_teach'}}
 ]},

{y:11, s:'夏', who:'chen', title:'厂里在评绿色工厂', cost:1,
 ig:{t:'评审那天，车间提前一天大扫除，标语贴了一墙。专家问一个工人厂里的节能目标是什么，那人说"我来三个月了"。', fx:{fame:-3, morale:-3}},
 t:'厂里报绿色工厂，专家下周来现场。<em>车间要挂标语、背指标，还要挑几个人接受提问。</em>主任点了你的名，让你准备一下。',
 o:[
  {t:'照着稿子背，问什么答什么', h:'<i>顺利过关</i>',
   r:'你背得很熟。专家问的时候你答得像念课文，对方点点头就走了。这件事没有任何后续。厂里拿了牌子，会议室多挂一块。',
   fx:{favor:5, fame:3}},
  {t:'把自己岗位上真做的事讲一遍', h:'<i>不一定符合口径</i>',
   r:'你讲了这些年岗位上换过的三样东西：新风过滤器、回收溶剂的桶、还有那个不再短接的联锁。专家听完追问了两个细节，你都答上来了。他后来跟厂长说："这个厂有人真懂。"这句话让你在车间里被半开玩笑地叫了半年"陈工二号"。',
   fx:{skill:3, favor:6, fame:6, morale:4, aff:{chen:4}, flag:'wk_real_answer'}},
  {t:'跟主任说：让真干活的人去，别让我演', h:'<i>顶回去</i>',
   r:'主任愣了一下，最后还是让你去了。你去了，但没背稿。这件事之后，凡是要"配合一下"的场合，车间不再找你。你少了很多露脸的机会，也少了很多别扭。',
   fx:{favor:-6, mates:5, morale:3}}
 ]},

{y:11, s:'秋', who:'wk', title:'岳父住院', cost:1,
 need:function(s){ return !!(s.flag.wk_married || s.flag.wk_late_marry); },
 ig:{t:'钱是你爱人的姐姐垫的。这件事在往后很多年的家庭场合被提起过不止一次。', fx:{mates:-2, cash:0.5, flag:'wk_inlaw_debt'}},
 t:'岳父脑梗住院，要用一笔钱，<em>而且以后需要长期有人照顾。</em>你爱人想辞职回去照看，家里一下少一份收入。',
 o:[
  {t:'钱我出，人你照顾', h:'<i>-4 万＋每年少一份收入</i>',
   r:'你爱人辞了工作。家里只剩你一份工资，那几年过得很紧。你把所有能上的班都上了。第十四年的体检报告，就是这几年攒出来的。',
   fx:{cash:-4, body:-8, flag:'wk_solo_income'}},
  {t:'请护工，两个人都别辞', h:'<i>-2.6 万／年</i>',
   r:'请了一个护工，一个月两千八。钱紧，但两份收入保住了。岳父后来恢复得一般。你爱人为没能亲自照顾这件事，愧疚了很多年。',
   fx:{cash:-2.6, mates:2}},
  {t:'跟厂里申请困难补助，能报多少报多少', h:'<i>要把家里的事摊开说</i>',
   r:'你填了表，附了病历，全车间都知道了你家的情况。批了八千,工会又凑了三千。有人说你会来事，也有人第二天默默塞给你两百块。这件事让你重新认识了一遍身边这些人。',
   fx:{cash:-1.9, mates:7, favor:-3, flag:'wk_aid'}}
 ]},

{y:12, s:'春', who:'chen', title:'督察组要找一线工人谈话', cost:2, key:1,
 ig:{t:'谈话名单里没有你。督察组走了以后，厂里被要求整改三项，车间开了一次会，念了一遍文件。', fx:{risk:1, morale:-3}},
 t:'中央环保督察进驻了，<em>明天要随机找一线工人谈话，不许厂里的人陪同。</em>厂里昨天开了会，讲了"应答口径"。我跟你说这个，是因为我不想让你被架住。',
 o:[
  {t:'照实说。他们问什么我说什么', h:'<i>厂里会难受</i>',
   r:'你讲了夜里关风机的事、讲了短接联锁的事、也讲了这两年整改之后好了很多。督察组记得很细。厂里被要求整改五项，罚了四十六万。整改完成之后，车间的空气和噪声都比以前好。厂长在会上说过一句"有些话不该跟外人说"，但没有点名。',
   fx:{favor:-12, mates:6, risk:-4, morale:6, money:-46, flag:'wk_truth'}},
  {t:'按口径说', h:'<i>厂里放心</i>',
   r:'你说的每一句都是厂里教的。督察组没有查出什么。厂长后来在食堂看见你，点了点头。那点头你记了很久，说不清是感激还是别的。',
   fx:{favor:10, mates:-5, risk:2, morale:-4, flag:'wk_cover2'}},
  {t:'说真话，但只说已经改好的那些', h:'<i>不撒谎</i> · 也没有全说',
   r:'你讲了减震垫、讲了新风过滤器、讲了那个不再短接的联锁。都是真的，也都是好的。督察组问还有没有别的，你说"我这个岗上没有了"。这句话是实话，也是一道门。',
   fx:{favor:4, mates:2, risk:1}}
 ]},

{y:12, s:'夏', who:'jun', title:'替我顶一下', cost:1,
 ig:{t:'阿军自己顶了这个违章，扣了五百，通报一次。他没说什么，但那年过年你们没在一起吃饭。', fx:{mates:-6}},
 t:'我上个月那个违章，安全科要处理。<em>你跟他们说是你交代我这么干的，你现在是组长，最多扣绩效，不通报。</em>我这个月要是再通报一次，就到解除合同的线了。',
 o:[
  {t:'顶。他家里的情况我知道', h:'<i>-0.05 万</i> · 你的记录上多一笔',
   r:'你签了那份说明。扣了五百，记录上多了一条。阿军留下了。第十三年优化名单出来的时候，你的那条记录被人翻出来提过一次。阿军那天在厂门口等了你两个小时。',
   fx:{cash:-0.05, favor:-6, mates:12, flag:'wk_cover_jun'}},
  {t:'不顶。这个字我签不了', h:'<i>规矩</i> · 也可能毁了一个人',
   r:'阿军被通报了，没到解除合同的线，但离得很近。他跟你说了句"我懂"，然后半年没跟你说过一句多余的话。你们是同一天进厂的，睡了三年上下铺。',
   fx:{favor:4, mates:-12, flag:'wk_refuse_jun'}},
  {t:'不顶，但陪他去说明情况，争取从轻', h:'<i>两边都不讨好</i>',
   r:'你陪他去了安全科，把当时的作业条件讲清楚了。处理结果是扣款不通报。安全科的人事后跟你说："你这个组长当得挺费劲。"阿军说了谢谢，但你们之间还是有了一点什么。',
   fx:{favor:-2, mates:5, risk:-1}}
 ]},

{y:13, s:'春', who:'zhou', title:'优化名单', cost:2, key:1,
 ig:{t:'名单是主任定的。走的五个人里有两个是你带过的。你在食堂看见他们收拾东西，绕了另一条路。', fx:{mates:-8, morale:-6, flag:'wk_silent_cut'}},
 t:'集团下了指标，车间要减五个人。<em>厂里让班组先报名单。</em>论手艺，该走的是那几个老的；论家庭，谁走都不合适。这份名单，得有人写。',
 o:[
  {t:'照手艺和考核排，谁差谁走', h:'<i>公平</i> · 也最冷',
   r:'你按考核分排了名单，一个人情都没留。走的五个人里有老陆。他签字那天什么都没说。这份名单挑不出毛病，往后三年车间的产量和质量都是全厂最好的。也是从那三年起，没有人在班前会上跟你开玩笑了。',
   fx:{favor:10, mates:-14, morale:-6, skill:2, flag:'wk_cutlist'}},
  {t:'把年纪大的护住，让年轻的先走', h:'<i>老人认你</i> · 年轻人恨你',
   r:'你保住了三个五十往上的。走的是两个刚满三年的年轻人和一个派遣工。老陆他们记着你的情。那两个年轻人在群里发了很难听的话。你没有回。',
   fx:{favor:-4, mates:6, morale:2, skill:-3, flag:'wk_protect_old'}},
  {t:'不写。要减我第一个走', h:'<i>可能真的要走</i>',
   r:'你把这句话说给了主任。主任愣住了，后来这份名单是他自己写的，五个人里没有你，也没有你护着的那几个。这件事让你在车间里成了一个传说，代价是那年的考核评了"基本称职"，三年内不能晋级。',
   fx:{favor:-14, mates:16, morale:8, cash:-0.6, flag:'wk_refuse_list'}}
 ]},

{y:13, s:'夏', who:'wk', title:'她想让我辞职去开店', cost:2,
 need:function(s){ return !!(s.flag.wk_married || s.flag.wk_late_marry); },
 ig:{t:'这事又拖了下去。她后来再没提过。有几年你们之间那种沉默，比吵架还难受。', fx:{body:-4, mates:-2}},

 o:[
  {t:'辞。干了十三年，也该换个活法', h:'<i>-22 万 · 没有社保</i>',
   r:'你办了离职。铺子开起来了，头一年赚了六万，第二年隔壁开了家连锁便利店。你们撑到了第五年。这五年你睡得比过去十三年都好，但每次路过厂门口，你都要往里看一眼。',
   fx:{cash:-22, flag:'wk_shop'}},
  {t:'不辞。厂里稳，社保、公积金都在这儿', h:'<i>稳</i> · 也是把她的话挡了回去',
   r:'你说了很多理由，每一条都对。她没再说什么，只是那天晚上很晚才睡。第二年那个铺面被别人盘走了，现在是家药店，生意不错。你们从来没有一起路过那家药店。',
   fx:{favor:2, body:-3, flag:'wk_stay_factory'}},
  {t:'她开，我继续上班，两头顶着', h:'<i>-22 万</i> · 你一天当两天用',
   r:'铺子归她管，你下了班去搭把手。前两年确实多了一份收入，但你每天睡不到五个小时。第十五年的体检报告，比第九年那份长了一倍。',
   fx:{cash:-22, body:-12, flag:'wk_both'}}
 ]},

{y:13, s:'秋', who:'jun', title:'阿军走了', cost:1,
 ig:{t:'阿军是自己走的，办完手续才跟你说。你们同一天进厂，隔了十三年，最后连顿饭都没吃上。', fx:{mates:-6, morale:-3, flag:'jun_gone'}},
 t:'我这次是真想好了。<em>回老家开货车，跑物流，一个月能有八千，不用倒班。</em>咱俩同一天进的厂，我想听你一句实话——我走，是不是傻？',
 o:[
  {t:'跟他说实话：这厂留不住人了', h:'<i>他会走</i>',
   r:'你把这两年的事都摆开讲了：优化名单、派遣工、越来越少的加班。他听完点了点头，走的时候说："那你自己也留个后路。"这句话你后来想起过很多次。',
   fx:{mates:5, morale:-3, flag:'jun_gone'}},
  {t:'劝他留下，工龄和社保不值当断', h:'<i>为他好</i> · 也可能是耽误他',
   r:'他留了下来。第十五年那次优化他在名单上，工龄补偿拿了十一万。他没有怪你，但你自己心里过了很多遍那句"我劝的"。',
   fx:{mates:6, favor:2, flag:'jun_stay'}},
  {t:'请他喝顿酒，什么也不劝', h:'<i>朋友该有的样子</i>',
   r:'你们在厂门口那家小饭馆喝到十一点，说了很多以前的事。他第二个月走了。往后每年他回来一次，都要叫上你。第十六年你儿子结婚，他从老家开了六个小时的车过来。',
   fx:{mates:9, body:-2, flag:'jun_gone'}}
 ]},

{y:14, s:'春', who:'wk', title:'带的徒弟要走', cost:1,
 need:function(s){ return !!(s.flag.wk_teach || s.flag.wk_honest_teach); },
 ig:{t:'他走的那天你在上班，没顾上送。工具箱留在了原地，里面还有你送他的那把扳手。', fx:{mates:-4, skill:-2}},
 t:'师傅，我想跟您说个事。<em>宏远那边给的比这儿高一半，还给编制。</em>您教了我三年，我想听您一句话。',
 o:[
  {t:'让他走。这儿给不了他那些', h:'<i>你少一个人</i>',
   r:'你说得很平静，还把自己的经验写了两页纸给他。他走的时候鞠了个躬。第十六年你在市里的技能比武上见到他，他代表宏远拿了第二名。见面第一句是："师傅，第一名是您的名字我看到过。"',
   fx:{mates:4, morale:-2, flag:'wk_disciple_left'}},
  {t:'去给他争一争，看厂里能不能留', h:'<i>要欠人情</i>',
   r:'你找了主任，又找了人事，最后给了一个技能津贴。他留下了。第十六年你退居二线，接你班的就是他。',
   fx:{favor:-4, skill:3, morale:5, flag:'wk_disciple_stay'}},
  {t:'跟他说：留下来，以后这个车间是你的', h:'<i>画饼</i> · 但也可能是真的',
   r:'他犹豫了三个月，最后还是走了。临走时说："师傅，您说的我信，可我等不了那么久。"这句话你听着耳熟——十年前你自己也说过一模一样的话。',
   fx:{mates:-2, skill:-3, flag:'wk_disciple_left'}}
 ]},

{y:14, s:'夏', who:'wk', title:'身体先撑不住了', cost:1,
 need:function(s){ return (s.body || 60) <= 44; },
 ig:{t:'那次晕倒是在夜班的更衣室，是保安发现的。住了六天院，出来以后车间给你调了岗，工资少了一千一。', fx:{body:-10, cash:-1.3, skill:-4}},
 t:'你四十一了。<em>这两年爬三楼要歇一次，右手拿扳手的时候会抖。</em>上个月夜班你在操作台边上眯了十分钟，是徒弟叫醒的。他什么也没说。',
 o:[
  {t:'申请调岗，从倒班岗下来', h:'<i>-1.3 万／年</i> · 也是承认自己老了',
   r:'你调去了设备巡检岗，白班，工资少一千一。头几个月你很不习惯，总觉得自己被放到了一边。半年后你发现，你能看见的东西比在操作台上多得多——那些管路、那些接头、那些别人走过去不会看第二眼的地方。',
   fx:{cash:-1.3, body:14, skill:2, favor:-3, flag:'wk_lighter'}},
  {t:'撑着。还有四年就能内退了', h:'<i>咬牙</i>',
   r:'你撑住了这一年。第十六年春天你在夜班上倒了一次，送到医院是凌晨三点。你爱人在急诊室外面给你儿子打电话，说的第一句是："他早该不干了。"',
   fx:{body:-11, cash:0.5, favor:3, flag:'wk_burnout'}},
  {t:'去把职业健康那套流程走完', h:'<i>厂里会烦你</i>',
   r:'你把这些年的体检报告整理了一遍，正式提出了职业健康复查申请。厂里安排了复查，结论是"接触相关，建议调离"。这个结论让你调岗的同时保住了津贴，也让厂里给整个岗位加了防护。有五个人因为这件事受益，其中三个你都不认识。',
   fx:{cash:-0.4, body:12, mates:8, favor:-5, morale:5, risk:-1, flag:'wk_occ'}}
 ]},

{y:14, s:'秋', who:'chen', title:'厂里让你上台讲话', cost:1,
 ig:{t:'讲话的人换了别人，讲得四平八稳。你坐在台下，睡了一会儿。', fx:{favor:-3}},
 t:'厂里评了你劳模，<em>要在全厂大会上讲十分钟，稿子人事写好了。</em>我看了那个稿子，里面有一句是"十五年从未因个人原因请过一天假"。',
 o:[
  {t:'照稿子念', h:'<i>体面</i>',
   r:'你念完了，掌声挺响。台下有人小声说了句"那年他爸住院他不是请了假吗"。散会以后你把那张稿子折了两折，塞进了工作服口袋，后来在洗衣机里洗烂了。',
   fx:{favor:6, mates:-3, cash:0.5}},
  {t:'不念稿子，讲讲这十四年真实的日子', h:'<i>人事会紧张</i>',
   r:'你讲了倒班、讲了老张的手、讲了那年家里住院全车间凑的四千块。讲到一半台下很安静。厂长在下面听完，散会时跟你握了手，什么也没说。这段讲话没有留下录像，但很多人记了很多年。',
   fx:{favor:2, mates:14, morale:10, cash:0.5, flag:'wk_speech'}},
  {t:'把这个名额让给老陆', h:'<i>你什么也没得到</i>',
   r:'你跟主任说，老陆干了二十二年，该他上。主任觉得你有病，但还是同意了。老陆上台的时候手是抖的，讲了六分钟。他退休那年跟人说，这辈子最风光的就是那六分钟。',
   fx:{favor:-4, mates:12, morale:6, flag:'wk_yield2'}}
 ]},

{y:15, s:'春', who:'wk', title:'侄子技校毕业了', cost:2, key:1,
 ig:{t:'你没接这个电话。侄子自己找了工作，去了外地一家电子厂。他现在一个月拿多少，你是过年回家才听说的。', fx:{mates:-3, flag:'son_out'}},
 t:'老家来电话，<em>你弟弟家那小子技校毕业了，学的也是化工机械。厂里正好招工，你现在说句话，他能进三车间。</em>你弟弟在电话那头说："哥，你说了算。"',
 o:[
  {t:'让他来。有我看着，不会吃亏', h:'<i>安稳</i> · 也是把他放进同一条路',
   r:'他进了三车间，跟着你带过的人学。头一年他叫你师傅不叫叔。你把二十年前老周教你的东西一样样教给他，包括哪些活不能干、哪个字不能签。第十六年他问："叔，你们那会儿是不是比现在难？"你说："不是难，是不一样。"',
   fx:{morale:5, mates:5, flag:'son_in'}},
  {t:'不让。这条路我走过，不够好', h:'<i>要跟你弟弟说清楚</i>',
