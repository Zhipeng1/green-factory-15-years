  {t:'按下限罚，但附一个硬性的整改期限', h:'<i>折中</i>',
   r:'罚了十二万，但整改期限压到了四十五天，还约定了逾期按日计罚。企业四十天改完了。刘局说了句："你这个办法，两边都能交代。"这套做法后来成了你的招牌。',
   fx:{law:7, sys:5, pub:4, money:-12, risk:-2, cases:1, flag:'rg_balance'}},
  {t:'从轻，把这个人情记下来', h:'<i>+以后好办事</i> · 也欠了一笔',
   r:'你按下限的下限处理了。那位打招呼的人后来在你申报省级培训名额的时候帮过一次忙。这两件事之间没有任何直接联系，但你自己知道它们是连着的。',
   fx:{sys:8, pub:-6, guilt:3, money:-4, cases:1, flag:'rg_favor'}}
 ]},

{y:4, s:'秋', who:'chen', title:'企业的技术员来问路', cost:1,
 ig:{t:'你回了句"按标准来"。他没有再问。第二年那家企业的整改做错了方向，白花了四十万。', fx:{pub:-3, law:-2}},
 t:'方科，我是红星的陈工。<em>我们想把 VOCs 治理做到位，但标准里有几处我们理解不了，做错了就是几十万打水漂。</em>能不能请您给个意见？',
 o:[
  {t:'详细讲，还给他推荐了几个做得好的案例', h:'<i>越界</i> · 也是最有用的事',
   r:'你花了一下午给他讲清楚了，还带他去看了另一家做得好的企业。他们后来做的那套源头替代，在全市是第一家。第十二年督察进驻，这套设施是你们片区唯一被点名表扬的。',
   fx:{law:6, pub:8, sys:3, smoke:-4, risk:-2, fac:{air:2}, aff:{chen:6}, flag:'rg_help'}},
  {t:'只讲标准条文，不给具体意见', h:'<i>规矩</i> · 也没什么用',
   r:'你把条文念了一遍。他记了，回去自己琢磨。他们最后做出来的东西是对的，但多花了半年和二十多万。第八年他跟你说："方科，那次您要是多说两句，我们能少走很多弯路。"',
   fx:{law:3, sys:3, pub:-2}},
  {t:'把这类问题整理成一本指引，发给所有企业', h:'<i>花你两个月</i>',
   r:'你把这些年被问过的二十七个问题整理成了一本《常见环境问题整改指引》，印了三百本发下去。企业抢着要。第六年市局把它改成了全市版本，署的是市局的名。你什么也没说，但你办公室里留了一本最早的。',
   fx:{law:8, pub:10, sys:5, risk:-2, smoke:-2, body:-5, flag:'rg_manual'}}
 ]},

{y:5, s:'春', who:'ld', title:'有人举报你收了钱', cost:2, key:1,
 ig:{t:'调查了一个月，没有结论。这件事没有处理任何人，但它在分局传了半年，也进了你的档案。', fx:{sys:-5, pub:-3}},
 t:'纪检收到一封实名举报，说你在处理某家企业的时候收了好处。<em>点了你的名。</em>我得按程序找你谈。你有什么要说的？',
 o:[
  {t:'把这些年所有的接触都摊开', h:'<i>要看你自己干净不干净</i>',
   need:function(s){ return !s.flag.rg_take; }, because:'这些年你没伸过手',
   uid:'rg_clean_check',
   r:'你把五年的执法记录、接触登记、退回信封的那份报告一条条列了出来。调查组核完写了"未发现问题"。刘局后来说："那份退款报告，是你自己救了自己。"这件事之后，凡是敏感案件都由你牵头。',
   fx:{law:3, sys:8, pub:6, aff:{ld:4}, flag:'rg_cleared'}},
  {t:'承认，退还，接受处理', h:'<i>-钱 -前途</i> · 但账清了',
   r:'你退了全部所得，写了检查，受了政务警告，两年内不得提拔。这件事在系统里传了很久。第十一年你重新被启用，靠的是六年里一件复议都没输过。刘局说："犯过错还站得住的人，比没犯过的可靠。"',
   fx:{cash:-6, guilt:-6, sys:-10, pub:-2, flag:'rg_confess'}},
  {t:'咬死不认', h:'<i>赌他们查不到</i>',
   r:'调查了一个月，没有结论。你留下来了。此后每一年的廉政谈话你都要在心里过一遍那些账。第十二年那家企业的老板出事的时候，你在办公室坐了整整一个下午。',
   fx:{guilt:4, sys:-4, flag:'rg_deny'}}
 ]},

{y:5, s:'夏', who:'shi', title:'老鲁要退了', cost:1, key:1,
 ig:{t:'老鲁退休那天你在出差。他把二十年的现场笔记留在了办公桌抽屉里，后来被当作旧材料清理掉了。', fx:{law:-5, pub:-3, flag:'shi_gone'}},
 t:'我明年就退了。<em>这二十年，我这本子上记了七十多家企业的底细：哪家有暗管、哪家的老板讲道理、哪家表面干净其实最脏。</em>这些东西，档案里是没有的。',
 o:[
  {t:'拿本子记，一条条问清楚', h:'<i>一整个下午</i>',
   r:'你们在办公室坐了一下午，他说，你记。最后记了六十三条，其中十一条是"这家有问题但一直没查实"。第八年那次夜间偷排，线索就在这六十三条里的第四十一条。',
   fx:{law:10, pub:4, aff:{shi:5}, flag:'rg_notebook'}},
  {t:'请他退休后回来做执法顾问', h:'<i>要争一个名额</i>',
   r:'你跟刘局磨了两次，争到了一个特聘顾问的名额，一个月两千。老鲁每周回来两天，专门带新人和参与疑难案件。第十二年督察进驻，是他一眼看出了那份台账的时间逻辑有问题。',
   fx:{law:8, sys:-2, pub:5, aff:{shi:6}, flag:'rg_mentor'}},
  {t:'办个欢送会，热热闹闹送他走', h:'<i>体面</i> · 那六十三条从此没人知道',
   r:'饭店摆了三桌，他喝了不少，说了三次"这活儿干得值"。走的时候他把执法记录仪的挂绳留给了你，没有再说别的。那本笔记他大概是准备给你的，只是没有找到合适的时候。',
   fx:{pub:3, sys:2, aff:{shi:3}, flag:'shi_gone'}}
 ]},

{y:5, s:'秋', who:'reg', title:'该结婚了', cost:1,
 ig:{t:'这事拖了两年。对方后来去了南方。你在单位的时间因此更多了，多到有一年你连续七个月没休过一个整周末。', fx:{body:-4, sys:4, flag:'rg_single'}},
 t:'处了两年，对方家里在催。<em>办酒、彩礼、置办，算下来十来万。</em>你现在的存款你自己清楚，工资条上的数字十年也不会有太大变化。',
 o:[
  {t:'办，钱不够先借一点', h:'<i>-9 万</i>',
   r:'酒席办了十六桌。刘局来了，包了个红包，还批了七天假——那是你入职以来最长的一次假。往后几年确实紧，但家里有个人等你，夜里的应急电话也变得没那么难熬。',
   fx:{cash:-9, body:5, sys:2, flag:'rg_married'}},
  {t:'简办', h:'<i>-2.5 万</i> · 对方家里有意见',
   r:'两家人吃了一顿饭。你岳母那天全程没怎么说话。这件事后来在很多个家庭场合被提起，每提一次你都要解释一次。省下来的钱在第九年买房时派上了用场。',
   fx:{cash:-2.5, flag:'rg_married'}},
  {t:'再等等，等我把这几年熬过去', h:'<i>省钱</i> · 也有代价',
   r:'你说的"这几年"，后来变成了"这些年"。第十一年你才结婚。那时候职务上去了，钱也不是问题了。有些东西省下来，是要用别的东西补的。',
   fx:{cash:1.5, law:3, body:-4, flag:'rg_latemarry'}}
 ]},

{y:6, s:'春', who:'ld', title:'提你当科长', cost:2, key:1,
 ig:{t:'位子给了别人。那个人会写材料，现场去得少。往后三年，你查的案子要经他的手往上报。', fx:{sys:-6, flag:'rg_nolead'}},
 t:'执法科科长空出来了。<em>我想让你上，管六个人。</em>丑话说前头：上去了，一半时间在开会和写材料，现场你去不了几次了。',
 o:[
  {t:'接。有些事要在那个位置上才改得动', h:'<i>+收入</i> · 也从此离现场远了',
   r:'你上任第一件事是把执法检查计划改成按风险分级，重点企业一年四次，低风险的两年一次。头一年被人说"避重就轻"，第二年片区的立案质量和企业满意度同时上去了。代价是你一年只能下十几次现场，很多事变成了听汇报。',
   fx:{cash:2.4, sys:10, law:-2, pub:3, flag:'rg_lead'}},
  {t:'接，但要求保留一线执法资格', h:'<i>两头都要</i> · 也两头都累',
   r:'刘局同意了。你白天开会，抽空还是往现场跑。第九年那次夜查，全科只有你敢下到那个池子边上取样。科里的人服你，是因为你还在干他们干的活。代价是那几年你没有一个完整的周末。',
   fx:{cash:2.4, sys:8, law:4, pub:5, body:-8, flag:'rg_lead'}},
  {t:'不接。我想在现场干', h:'<i>纯粹</i> · 也从此没有话语权',
   r:'刘局有点惋惜。往后几年你是分局最懂现场的人，也是最没有话语权的人。检查计划、案件定性、处罚裁量，每一样都要看别人的意见。第十一年你有一个很好的判断，报上去被压了半年。',
   fx:{law:9, pub:6, sys:-8, flag:'rg_nolead'}}
 ]},

{y:6, s:'夏', who:'min', title:'一家小厂要被关了', cost:2, key:1,
 ig:{t:'关停通知按原方案下发。那家厂三十七个工人，两周内散了。老板在门口贴了一张纸，写着"干了十九年"。', fx:{pub:-8, guilt:2, cases:1}},
 t:'方科，我是村口那家电镀厂的。<em>我们是十九年的老厂子，现在的标准我们确实达不到，但我这三十七个工人怎么办？</em>能不能给我们一年时间。',
 o:[
  {t:'依法关停。达不到就是达不到', h:'<i>正确</i> · 也无情',
   r:'厂子两周内关了。三十七个人散了，其中十一个是四十五岁以上、再就业很困难的。这个案子在你的执法记录里是"办结"，在那三十七个人的人生里是别的东西。你后来去那个村口路过过一次，没有停车。',
   fx:{law:4, sys:6, pub:-9, guilt:3, cases:1, flag:'rg_close'}},
  {t:'给一年过渡期，签订整改承诺，逐月核查', h:'<i>你要担责</i>',
   r:'你顶着压力做了一个"限期治理＋逐月核查"的方案，签了责任书。那家厂真的改成了，还多干了八年。但这一年里你去了十四次，其中有两次是半夜。如果他们那一年出了事，第一个被追责的是你。',
   fx:{law:7, pub:11, sys:-6, risk:-1, body:-6, cases:1, flag:'rg_transition'}},
  {t:'帮他们找搬迁和转产的路子', h:'<i>不是你的职责</i>',
   r:'你跑了园区管委会和工信部门，帮他们对接了一个集中电镀园区的名额。搬过去以后规模小了，但活下来了，工人留下了二十几个。这件事不在你的任何一项考核指标里。第十三年那位老板的儿子考上了大学，专门来分局送了一面锦旗。',
   fx:{law:5, pub:13, sys:-3, body:-5, cases:1, flag:'rg_relocate'}}
 ]},

{y:6, s:'秋', who:'reg', title:'第一次上法庭', cost:1,
 ig:{t:'案子由法制科的人出庭，输了。撤销的理由是程序瑕疵。那是你写的笔录。', fx:{law:-5, sys:-5}},
 t:'那家企业提了行政诉讼，<em>要求撤销你去年做的那份处罚决定。</em>下周开庭，法制科问你要不要自己出庭。',
 o:[
  {t:'自己出庭', h:'<i>可能当庭被问倒</i>',
   r:'你准备了两周，把证据链和法律适用捋了三遍。庭上对方律师抓住采样时间的记录追问了十分钟，你答上来了，因为那天的原始记录你留了三份。判决维持。这场庭之后，你在这一行才算真的站住了。',
   fx:{law:10, sys:6, pub:5, body:-5, flag:'rg_court'}},
  {t:'让法制科去，自己在旁听席上看', h:'<i>稳妥</i>',
   r:'案子赢了，赢得不轻松。你在旁听席上把对方律师的每一个问题都记了下来，回来改了自己的取证清单。这份清单后来在科里传了很多年。',
   fx:{law:6, sys:3}},
  {t:'建议撤销原处罚，重新做一次', h:'<i>丢面子</i> · 但把程序补对了',
   r:'你自己承认那份笔录有瑕疵，建议撤销重做。刘局同意了。重做的那份滴水不漏，企业没有再诉。这件事在分局传成了"小方自己撤了自己的案子"，有人当笑话讲，也有人从此不敢在程序上偷懒。',
   fx:{law:8, sys:-4, pub:4, flag:'rg_selfrevoke'}}
 ]},

{y:7, s:'春', who:'ld', title:'企业说你们标准不统一', cost:1,
 ig:{t:'这件事没有回应。企业界的说法慢慢变成了"这个片区的执法看人下菜"。这个印象你花了很多年也没洗干净。', fx:{pub:-6, sys:-2}},
 t:'企业协会反映，<em>说同样的问题，不同的执法人员给的结论不一样，有的罚有的不罚。</em>这个话我压了两次了。你怎么看？',
 o:[
  {t:'做一套裁量基准，把自由裁量的空间压下去', h:'<i>得罪同事</i>',
   r:'你带人做了一份细化到情节、后果、频次的裁量基准表，把处罚幅度压缩成了区间。科里有两个人明确反对，说这是"自己给自己上枷锁"。执行第一年，行政复议率降了六成。第十年市局照着做了全市版本。',
   fx:{law:9, sys:5, pub:10, body:-5, flag:'rg_discretion'}},
  {t:'开个会，跟企业解释清楚执法的依据', h:'<i>有用</i> · 有限',
   r:'你办了一场政策解读会，来了六十多家企业。当场气氛很好。半年后同样的抱怨又出现了——因为问题不在解释，在标准本身就是有弹性的。',
   fx:{pub:4, sys:3, law:2}},
  {t:'不理。执法就是要有威慑', h:'<i>省事</i>',
   r:'你没有回应。企业界的说法慢慢变成了"看人下菜"。第十二年督察组来做企业访谈，这句话被写进了访谈记录。刘局问你的时候，你没有话说。',
   fx:{sys:2, pub:-8, guilt:1}}
 ]},

{y:7, s:'夏', who:'chen', title:'企业主动来自首', cost:2, key:1,
 ig:{t:'那封邮件你没有回。三个月后同样的问题被上级交办件查出来，企业被顶格处罚，那个主动来说的人被认为是"通风报信的内鬼"。', fx:{pub:-6, guilt:2, cases:1}},
 t:'方科，有件事我想主动跟您说。<em>我们厂的在线监测有一段数据被改过，是四年前的，我最近自己查出来的。</em>我知道说了会被罚。但我想说。',
 o:[
  {t:'鼓励主动报告，从轻处理并公开这个案例', h:'<i>要顶住"包庇"的质疑</i>',
   r:'你按主动消除危害后果做了从轻，罚了十二万，并在全市通报里把"企业主动报告"作为从轻情节写了进去。有同事说你太软。第十一年，片区里主动报告的企业增加到了九家，其中三起是重大隐患。这个机制后来被市局采纳。',
   fx:{law:8, pub:12, sys:4, money:-12, risk:-3, cases:1, aff:{chen:6}, flag:'rg_selfreport'}},
  {t:'照章办，该顶格顶格', h:'<i>没有毛病</i> · 也没有下一次',
   r:'你按篡改数据顶格罚了一百万，移送了公安。程序上完全正确。这件事之后，你片区里再没有一家企业主动报告过任何问题。第十二年督察查出了七起类似的事，全部是被动发现的。',
   fx:{law:5, sys:8, pub:-6, money:-100, cases:1, aff:{chen:-6}, flag:'rg_maxpunish'}},
  {t:'不立案，让他们自己整改，这事到此为止', h:'<i>人情</i> · 你把风险接过来了',
   r:'你没有立案。企业整改了。这件事没有任何记录。第十三年一次专项审计翻到了那段数据，问为什么当时没有处理，你答不上来——因为你没有留下任何说明。',
   fx:{pub:4, guilt:4, sys:-4, report:1, aff:{chen:5}, flag:'rg_hush'}}
 ]},

{y:7, s:'秋', who:'ld', title:'跨区域的一条线索', cost:1,
 ig:{t:'线索没有往下追。半年后那批危废在邻县被查获，办案的是别人。通报里没有你们的名字。', fx:{sys:-4, law:-2}},
 t:'有条线索：<em>咱们片区一家企业的危废转移联单，接收方在三百公里外，但那家公司的地址是一片荒地。</em>跨区域，取证难，办下来不容易。',
 o:[
  {t:'追。跑三百公里也要追', h:'<i>要跑很多趟</i>',
   r:'你跑了四趟，联合了两地公安，最后查实是非法转移倾倒一百八十吨。移送三人，罚款两百二十万。这个案子上了年度典型案例。你在颁奖台上想起的是老鲁笔记里的第四十一条。',
   fx:{law:10, sys:9, pub:8, body:-7, cases:1, flag:'rg_bigcase'}},
  {t:'把线索移交给上级，让他们统筹', h:'<i>规范</i> · 功劳不是你的',
   r:'市局接了，办成了。通报里你们分局是"提供线索"。刘局说了句"该是你的跑不掉"，但你知道那年评先进的时候，这句话不算数。',
   fx:{sys:3, law:3, cases:1}},
  {t:'先把本地这一头查实，能罚多少罚多少', h:'<i>现实</i>',
   r:'你查实了本地企业未尽审核义务，罚了三十万。这是能拿到的最扎实的结果。那一百八十吨最后去了哪里，你到现在也不知道。',
   fx:{law:6, sys:4, money:-30, cases:1, flag:'rg_local'}}
 ]},

{y:8, s:'春', who:'min', title:'有人举报红星夜里排放', cost:2, key:1,
 ig:{t:'举报件转企业自查，回复"未发现异常"。这件事在第十二年督察进驻的时候被翻了出来，成了分局的一条问题线索。', fx:{pub:-8, sys:-5, risk:2, report:1, cases:1}},
 t:'红星厂夜里有味儿，<em>不是一天两天了，是他们自己厂里的人透出来的。</em>说是治理设施夜里关。这个我不敢报名字，你们能不能查一查。',
 o:[
  {t:'半夜突击，蹲三个晚上', h:'<i>三个通宵</i> · 也可能扑空',
   r:'第二个晚上你逮到了：治理设施电流为零，排口非甲烷总烃是白天的四倍。证据链做得干净。罚了四十六万，责令整改，全市通报。那家厂从此没有再关过风机。举报人后来在电话里跟你说了一句谢谢。',
   fx:{law:9, pub:12, sys:6, risk:-3, money:-46, smoke:-3, body:-8, cases:1, aff:{cz:-4}, flag:'rg_nightcatch'}},
  {t:'调在线数据和用电量，从数据入手', h:'<i>不用熬夜</i> · 也更容易被规避',
   r:'你调了半年的用电数据，发现设施用电和生产负荷严重不匹配。企业解释是"设备变频"。这个解释在技术上站得住，你没有办法。三个月后你换了办法，才把这件事查实。这半年的弯路，是因为你不想熬那三个夜。',
   fx:{law:6, sys:3, pub:2, risk:-1, cases:1}},
  {t:'先约谈厂长，把话说到明处', h:'<i>打草惊蛇</i> · 也可能省很多事',
   r:'你把许厂长请到分局，把线索和后果讲清楚了，给了三十天自查期。他们自查报了两个问题，整改了。这个做法没有罚款、没有通报、没有案卷，在系统里等于什么也没发生。但那两个问题是真的改了。',
   fx:{pub:6, risk:-2, sys:-4, law:2, aff:{cz:3}, flag:'rg_talkfirst'}}
 ]},

{y:8, s:'夏', who:'ld', title:'一票否决的压力', cost:2,
 ig:{t:'指标没完成。分局在市里的排名掉到了倒数第三。年终考核，全局的绩效都受了影响，有人私下把账算到了你头上。', fx:{sys:-8}},
 t:'今年的空气质量优良天数还差六天。<em>市里说了，完不成一票否决。</em>最后一个季度，你们片区所有涉气企业，我需要一个方案。',
 o:[
  {t:'按排放强度和治理水平分级，只限产最差的那批', h:'<i>要顶住"不彻底"的质疑</i>',
   r:'你做了一份分级清单，只对十一家排放强度最高的企业限产，其余正常生产。天数刚好完成。有人说你放水，也有企业专门打电话来道谢。第二年市里推广了分级管控，文件里的思路和你那份清单几乎一样。',
   fx:{law:8, sys:5, pub:10, smoke:-3, flag:'rg_tiered'}},
  {t:'全面限产，先把天数保住', h:'<i>一刀切</i> · 最安全也最伤人',
   r:'片区四十三家企业全部限产半个月。天数保住了。有七家企业因此违约赔款，两家小厂再也没有开工。那半个月里，你的手机每天要接三十多个电话。多年以后有人问起你最不愿意回想的事，是这一件。',
   fx:{sys:9, pub:-14, guilt:4, smoke:-4, money:-40, flag:'rg_onesize'}},
  {t:'跟刘局说：这个指标完不成，我担着', h:'<i>硬顶</i>',
   r:'你写了一份说明，讲清楚气象条件的影响和一刀切的代价，建议不再加码。刘局把它原样报了上去。指标差了四天，分局挨了通报，刘局的年度考核降了一档。他一句怨言没有。这件事你记了一辈子。',
   fx:{law:5, pub:9, sys:-12, aff:{ld:5}, flag:'rg_refuse_quota'}}
 ]},

{y:8, s:'秋', who:'reg', title:'家里要买房', cost:1,
 need:function(s){ return !!(s.flag.rg_married || s.flag.rg_latemarry); },
 ig:{t:'房子的事一直拖着。你们租的房子换了三次，最后一次搬家是在冬天，孩子发着烧。', fx:{cash:1.0, body:-4, flag:'rg_nohouse'}},
 t:'孩子过两年上学。<em>城里的房子首付三十五万，你们两个人的公积金加起来一个月两千二。</em>你这个岗位的收入，往后十年基本看得到头。',
 o:[
  {t:'买，借一部分', h:'<i>-22 万</i> · 往后十年不敢出事',
   r:'首付借了老家八万。往后十年你不敢辞职，也不敢在任何一件事上把自己彻底摆进去。有一次你想为一个案子硬顶到底，最后没有。你说服自己的理由是"要顾全大局"，但你知道不全是。',
   fx:{cash:-22, sys:2, pub:-2, flag:'rg_mortgage'}},
  {t:'先租，等等看', h:'<i>-4 万／年</i> · 你走得掉',
   r:'你们又租了几年。日子紧一点，但你保住了一样东西：如果哪一天真的干不下去了，你走得掉。这一点在第十二年那件事上，起了决定性的作用。',
   fx:{cash:-4, flag:'rg_rent2'}},
  {t:'买单位附近的老小区，便宜', h:'<i>-12 万</i> · 学区一般',
   r:'房子旧，但没什么压力。孩子在片区学校读书。这个决定让你在往后十年里比很多同事自由——第十二年那次你敢把话说到底，跟这套房子有点关系。',
   fx:{cash:-12, flag:'rg_smallhouse'}}
 ]},

{y:9, s:'春', who:'ld', title:'一起环境事件', cost:2, key:1,
 ig:{t:'事件按最坏的方向发展。下游三个村的取水口停用了六天。调查组进驻，翻出了你两年前那份检查记录——上面写着"未发现异常"。', fx:{sys:-12, pub:-10, guilt:3, report:1, risk:2, flag:'rg_accident'}},
 t:'凌晨两点，一家企业的事故池溢流，<em>废水进了灌溉渠。</em>现在有两个问题：一是怎么处置，二是要不要往上报。往上报，全市通报；不报，风险是你我一起担。',
 o:[
  {t:'立刻上报，同时组织截流和应急监测', h:'<i>全市通报</i> · 也是唯一对的做法',
   r:'你三点半到现场，五点完成截流，天亮前布了六个监测点。上报之后市里派了专家组，处置很及时，下游没有受影响。分局挨了通报，但事件本身没有扩大。后来这个案例被写进了市里的应急处置培训教材。',
   fx:{law:9, pub:12, sys:-5, risk:-2, body:-8, cases:1, flag:'rg_report_acc'}},
  {t:'先处置，压一压再看情况', h:'<i>赌它不扩大</i>',
   r:'你们连夜处置，到中午基本控制住了，没有上报。第三天下游村民发现渠里的鱼死了，事情还是捅了上去。因为迟报，处理比原本重了一档。你被诫勉谈话，刘局作了检讨。',
   fx:{sys:-10, pub:-6, guilt:4, report:1, cases:1, flag:'rg_latereport'}},
  {t:'上报，并且把这家企业这几年的检查记录一并交上去', h:'<i>可能把自己也交出去</i>',
   r:'你把包括自己签字的六份检查记录一起交了。调查组核完之后认定检查程序无瑕疵，事故原因是企业擅自改造管线。你没有被追责。刘局说："你这一手，是把自己放在明处。这个厂里敢这么做的人不多。"',
   fx:{law:7, pub:9, sys:3, risk:-2, cases:1, flag:'rg_transparent_acc'}}
 ]},

{y:9, s:'夏', who:'reg', title:'有单位来挖你', cost:2, key:1,
 need:function(s){ return s.law >= 46 || !!s.flag.rg_cert; },
 ig:{t:'那个电话你没回。三年后那家公司在创业板上了市，当初找你的人现在是副总裁。', fx:{law:-2}},
 t:'一家环保咨询公司想请你过去做技术总监，<em>年薪是你现在的三倍，还有股权。</em>你手上的经验，在市场上比在体制内值钱得多。你今年三十四。',
 o:[
  {t:'去。这些年学的东西，在外面能用得更开', h:'<i>换一条路</i> · 故事在这里分岔',
   r:'你办了离职。刘局挽留了一次，说的是"再等等，位子会有的"。你说："我不是为了位子。"',
   fx:{flag:'rg_leave9'}},
  {t:'不去。这份工作有些事只有在这个位置上能做', h:'<i>放弃三倍收入</i>',
   r:'你婉拒了。回办公室的路上你算了一笔账：留下来这些年少挣的钱，够在城里再买一套房。但你也想起那个在阳台上等了你一个半小时的投诉人。',

  {t:'不去，但推荐科里那个年轻人过去', h:'<i>你少一个人</i>',

   fx:{law:5, pub:4, sys:-2, flag:'rg_referral'}}
 ]},

{y:9, s:'秋', who:'chen', title:'企业问你要不要"配合"一下', cost:1,
 ig:{t:'你没有明确表态。企业按自己的理解做了，做出来的东西刚好卡在标准的边上。第十二年督察查到这一项，认定为整改不到位。', fx:{risk:2, pub:-3, guilt:1}},
 t:'方科，我们那套设施要做验收监测，<em>监测公司问我们，要不要"选一个负荷合适的时段"。</em>我知道这个话不该问您，但我想听一句实话。',
 o:[
  {t:'告诉他：按最不利工况来，不然这个验收没有意义', h:'<i>他会更难做</i>',
   r:'你把话说死了，还给了他一份最不利工况的判定依据。他们照做了，结果没过，又改了两个月。第十二年督察进驻，这套设施是全市少数经得起满负荷抽测的。陈工说："那次要不是您那句话，我们后面得吃大亏。"',
   fx:{law:7, pub:8, risk:-3, smoke:-2, aff:{chen:6}, flag:'rg_worstcase'}},
  {t:'跟他说：这个我不能给意见', h:'<i>规矩</i> · 也没有帮到任何人',
   r:'你把话挡了回去。他"哦"了一声，挂了电话。他们最后选了一个中等负荷的时段，验收过了。这件事程序上没有任何问题，只是那套设施到底行不行，谁也不知道。',
   fx:{sys:3, law:2, pub:-2}},
  {t:'跟他说：你们自己看着办，别让我知道', h:'<i>心照不宣</i>',
   r:'这句话的意思他听懂了。验收顺利过了。第十二年督察抽测，那套设施在满负荷下超标 1.8 倍。追溯到验收环节的时候，所有的文件都是齐的，包括你签的那份意见。',
   fx:{guilt:4, risk:2, sys:-3, report:1, flag:'rg_wink'}}
 ]},

{y:10, s:'春', who:'ld', title:'红星要报绿色工厂', cost:1,
 ig:{t:'推荐意见由综合科出的，模板化的一段话。评审时专家问了一句"属地监管部门对这家企业的评价"，没有更具体的内容可以提供。', fx:{pub:-2, sys:-2}},
 t:'红星报国家级绿色工厂，<em>需要属地生态环境部门出一份合规证明和推荐意见。</em>这家企业前几年被你罚过，现在这个字，你签不签？',
 o:[
  {t:'签，但把这些年的处罚和整改情况一并写清楚', h:'<i>企业未必领情</i>',
   r:'你写了三页：哪一年因为什么被罚，之后做了哪些整改，现在的实际排放水平。评审专家看完说："这是我见过写得最实的一份属地意见。"红星过了。许厂长后来说："方科，您那份材料写了我们三次处罚，我一开始想找您，后来想通了——正是那三次，说明我们是真改了。"',
   fx:{law:6, pub:9, sys:5, fame:8, aff:{cz:4}, flag:'rg_endorse'}},
  {t:'照模板签一段', h:'<i>省事</i>',
   r:'你签了标准表述。红星过了。这件事对谁都没有影响，也对谁都没有帮助。',
   fx:{sys:2, fame:4}},
  {t:'不签。他们的历史问题还没有清干净', h:'<i>硬</i> · 也可能是对的',
   r:'你列了两条尚未闭环的问题，出了不予推荐的意见。红星那年没报成。第二年他们把那两条做完了，你签了字。许厂长在申报会上说了句："去年那个不签，比今年这个签值钱。"',
   fx:{law:7, pub:6, sys:-4, fame:-4, risk:-2, aff:{cz:2}, flag:'rg_holdback'}}
 ]},

{y:10, s:'夏', who:'reg', title:'执法记录仪的那段录像', cost:2, key:1,
 ig:{t:'投诉件按程序回复了。录像没有调，理由是"设备存储已覆盖"。这个理由是真的，但它同时也很方便。', fx:{pub:-6, guilt:2}},
 t:'有企业投诉说你们科的一个同事现场执法时言语不当。<em>执法记录仪里有那段录像。</em>调出来看，同事要挨处分；不调，这事儿也就过去了。',
 o:[
  {t:'调出来，该怎么处理怎么处理', h:'<i>科里会有意见</i>',
   r:'录像里那句话确实很难听。你把情况如实报了，那位同事被通报批评，调离了执法岗。科里有三个人半年没跟你好好说过话。但从那以后，你们科的执法记录仪没有一次"忘记开机"。',
   fx:{law:4, pub:10, sys:4, morale:-4, flag:'rg_tape'}},
  {t:'调出来自己看，内部批评，不上报', h:'<i>护短</i> · 也算处理了',
   r:'你把他叫来看了那段录像，他自己都愣住了。他道了歉，你没有上报。这件事在科里没有留下任何记录。第十三年他因为另一件事被查，翻出这段旧录像的时候，你被问了一句"当时为什么不报"。',
   fx:{morale:3, guilt:2, sys:-3, report:1}},
  {t:'不调。这种事查起来没完', h:'<i>省事</i>',
   r:'投诉按程序回复了"未发现不当行为"。那家企业没有再追。但那句话在企业圈子里传开了。第十二年督察组做企业访谈，有人提到了这件事。',
   fx:{pub:-8, guilt:3, sys:-2}}
 ]},

{y:10, s:'秋', who:'reg', title:'孩子上小学', cost:1,

 o:[

   r:'你调去了法制岗，白班，津贴少了一截。头一年很不习惯。但你在案卷里看见了另一个世界：哪些案子办得糙、哪些证据链站不住、哪些处罚畸轻畸重。你把这些整理成了一份复议风险清单。这份清单救过科里四个案子。',
   fx:{cash:-0.5, law:8, pub:-3, body:8, flag:'rg_desk'}},
  {t:'不调。这几年正是关键期', h:'<i>前途</i>',
   r:'你留在了一线。第十三年你当上副局长。孩子的家长会你去过三次。第十六年他写了一篇作文，题目是《我爸爸的电话》，你看完在阳台上站了很久。',
   fx:{sys:6, law:4, body:-8, flag:'rg_kid_far'}},
  {t:'把应急值班改成轮班制，全科一起排', h:'<i>要动大家的奶酪</i>',
   r:'你推动科里把"谁负责谁到场"改成了轮班制。有两个人明确反对，说这是"给自己减负"。但执行一年后，全科的病假天数降了一半，夜间到场时间反而缩短了。刘局说："你这个改得对，就是没人愿意得罪人去改。"',
   fx:{sys:-3, morale:6, pub:3, body:6, flag:'rg_rotation'}}
 ]},

{y:11, s:'春', who:'ld', title:'督察要来了', cost:2, key:1,
 ig:{t:'督察进驻后，你们片区被交办了九件问题。其中三件是历史遗留、两件是台账不实。分局挨了通报，刘局作了检讨。', fx:{sys:-10, pub:-5, report:1}},
 t:'中央环保督察下个月进驻。<em>现在有两种做法：一种是提前把辖区的问题都排一遍，能改的改；一种是先把材料理顺，别让人挑出毛病。</em>你说怎么办。',
 o:[
  {t:'先排问题。查出多少算多少', h:'<i>可能查出一堆</i>',
   r:'你带人排了三周，列出四十七个问题，其中十一个是明显的历史欠账。你把清单原样报了上去。督察进驻后交办了六件，其中四件你们已经在整改。督察组的评价是"属地排查主动"。这次通报里没有你们分局。',
   fx:{law:8, pub:9, sys:6, risk:-3, body:-7, flag:'rg_precheck'}},
  {t:'先理材料，把该有的档案做齐', h:'<i>过关</i> · 但问题还在',
   r:'材料理得很漂亮。督察组翻了两天没挑出程序问题，转而去了现场，交办了七件。其中三件在你们的材料里被写成了"已整改"。刘局在会上没有点名，但那次会开得很长。',
   fx:{sys:3, pub:-6, guilt:3, report:1, risk:1, flag:'rg_paperwork'}},
  {t:'排问题，但把最棘手的那几件先压一压', h:'<i>务实</i> · 也是赌',
   r:'你排出了四十七个问题，报上去四十一个。压下来的六个里，有一个第十四年出了事。追溯的时候，那份四十一项的清单被调了出来。没有人问你为什么是四十一而不是四十七，但你自己知道。',
   fx:{sys:5, pub:2, guilt:3, risk:1, flag:'rg_hold6'}}
 ]},

{y:11, s:'夏', who:'min', title:'投诉人搬走了', cost:1,
 ig:{t:'你没有再联系过他。多年以后你路过那个小区，看见他家的阳台上晾着别人的衣服。', fx:{pub:-3}},
 t:'方科，我搬走了。<em>不是因为你们没管，是我孩子的哮喘等不起。</em>这十年我投诉了二十七次，你接过其中十一次。走之前我想跟你说一声。',
 o:[
  {t:'把这十年的投诉和处理结果整理一份给他', h:'<i>不在你的职责里</i>',
   r:'你花了一个晚上把二十七次投诉的处理结果和这十年该企业的排放变化整理成了一份材料给他。他回了一条很长的消息，最后一句是："原来是有变化的，只是慢。"这份材料后来成了分局公开信访办理结果的模板。',
   fx:{law:4, pub:12, sys:3, flag:'rg_closure'}},
  {t:'跟他道个歉', h:'<i>你没有做错什么</i> · 但你还是想说',
   r:'你说了对不起。他愣了一下，说："你没什么好道歉的，你是这十年里唯一半夜来过我家阳台的人。"这句话你后来在很多个难熬的夜里想起过。',
   fx:{pub:8, guilt:-2, flag:'rg_sorry'}},
  {t:'不说什么。这一行本来就是这样', h:'<i>职业</i>',
   r:'你说了几句客气话。挂了电话你在办公室坐了一会儿。这个案子在系统里的状态是"已办结"，办结日期是十年前的那一次。',
   fx:{pub:-3, guilt:1}}
 ]},

{y:11, s:'秋', who:'shi', title:'老鲁的那六十三条', cost:1,
 need:function(s){ return !!s.flag.rg_notebook; },
 ig:{t:'那个本子在你抽屉里放了很多年。搬办公室的时候你翻过一次，里面有十一条到最后也没有查实。', fx:{law:-2}},
 t:'老鲁走的时候留给你的那六十三条，<em>到今天还剩十一条没有查实。</em>其中有三条指向的企业，现在都是市里的重点培育对象。',
 o:[
  {t:'一条条查下去，查到哪算哪', h:'<i>会碰到硬骨头</i>',
   r:'你用两年查实了其中五条，办了三个案子，其中一个牵出了跨市的危废链条。剩下六条，有的证据灭失，有的企业早就关了。你在本子最后一页写了一行字：还剩六条。第十六年新来的年轻人接手了这个本子。',
   fx:{law:10, pub:8, sys:4, body:-6, cases:3, flag:'rg_finish63'}},
  {t:'把这个本子交给科里，大家一起分头查', h:'<i>不再是你一个人的事</i>',
   r:'你把六十三条录入了系统，做成了片区的问题台账，公开给全科。两年内查实了七条。有人说这是"翻旧账"，也有人说这才叫传承。这套台账后来成了分局的标准做法。',
   fx:{law:7, sys:6, pub:6, morale:4, cases:2, flag:'rg_share63'}},
  {t:'不动了。有些事翻出来对谁都不好', h:'<i>现实</i>',
   r:'你把本子锁进了抽屉。这个决定在当时看起来很成熟。第十四年那三家里的一家出了事，事后有人问你知不知情。你说"有过线索，没有查实"。这句话是真的。',
   fx:{sys:3, guilt:3, risk:1, flag:'rg_bury63'}}
 ]},

{y:12, s:'春', who:'chen', title:'数据造假的案子', cost:2, key:1,
 ig:{t:'案子交给了别人办。办得很快，罚了款，移送了两个人。其中一个是操作工，他只是照着上面说的填了表。', fx:{pub:-6, guilt:2, cases:1}},
 t:'查实了：<em>一家企业的在线监测数据被系统性修改，持续四年。</em>直接操作的是运维公司的技术员和企业的一名操作工，指使的是分管副总，但没有书面证据。',
 o:[
  {t:'往上追，把指使人查出来', h:'<i>难</i> · 也是唯一公平的做法',
   r:'你花了四个月，从审批流、通讯记录和资金往来里做出了完整的证据链。分管副总被移送，操作工按从犯从轻。这个案子在市里成了范例。那个操作工后来托人带话给你："方科，谢谢您没把我当主犯。"',
   fx:{law:10, pub:12, sys:6, money:-100, body:-8, cases:1, flag:'rg_chase_up'}},
  {t:'按现有证据办，谁动手办谁', h:'<i>快</i> · 也最不公平',
   r:'案子两周办结，罚了一百万，移送两人。程序上无可挑剔。那个操作工三十四岁，两个孩子。判决之后他的家人来分局哭过一次。你在办公室里坐着，没有出去。',
   fx:{law:5, sys:8, pub:-6, guilt:4, money:-100, cases:1, flag:'rg_lowlevel'}},
  {t:'办案的同时，推动全市运维公司的资质核查', h:'<i>把一个案子变成一件事</i>',
   r:'你在办案的同时发现全市有三家运维公司存在同样的问题，推动了一次专项核查，清退了两家。这件事的影响远远超过了这一个案子。市局在总结里用了"举一反三"四个字，你在会上没有说话。',
   fx:{law:9, sys:7, pub:9, risk:-3, money:-100, cases:2, flag:'rg_systemic'}}
 ]},

{y:12, s:'夏', who:'ld', title:'刘局要退了', cost:2, key:1,
 ig:{t:'刘局退休那天你在外地办案。他的办公室三天后就搬空了，桌上那本翻烂的执法手册被当作旧书处理掉了。', fx:{sys:-4, aff:{ld:-2}}},
 t:'我明年退。<em>这些年我替你挡过几次，你自己知道。</em>走之前我想问你一句：这十二年，你后悔过吗？',
 o:[
  {t:'后悔过一次，就是那年的一刀切', h:'<i>说实话</i>',
   need:function(s){ return !!s.flag.rg_onesize; }, because:'那年冬天你签了全面限产',
   uid:'rg_regret',
   r:'你说了那四十三家企业和两家再没开工的小厂。刘局沉默了很久，说："那件事是我压给你的。"你说不是。他说："是。我这些年最对不起的就是这一件。"两个人都没有再说话。',
   fx:{pub:4, guilt:-4, aff:{ld:5}}},
  {t:'不后悔。每一步都是当时能做到的', h:'<i>坦然</i>',
   r:'他看了你很久，说："这话要么是想通了，要么是不想想了。"你没有回答。他站起来跟你握了手，说了句"谢谢你这些年顶着"。',
   fx:{sys:3, aff:{ld:4}}},
  {t:'后悔的是有几次该硬没硬', h:'<i>诚实</i>',
   r:'你说了三件事，包括那次不予立案的"到此为止"。他说："这三件我都知道。你知道我为什么没拦你吗？因为我那个位子上，同样的事我做过更多。"这是他跟你说过的最重的一句话。',
   fx:{law:3, pub:5, guilt:-3, aff:{ld:5}, flag:'rg_honest_talk'}}
 ]},

{y:12, s:'秋', who:'reg', title:'身体先撑不住了', cost:1,
 need:function(s){ return (s.body || 60) <= 44; },
 ig:{t:'那次头晕是在现场爬平台的时候。你扶着栏杆站了两分钟，没有告诉任何人，把那次检查做完了。', fx:{body:-10, cash:-1.0}},
 t:'你三十七岁。<em>血压高了三年，夜里的应急电话平均一个月四次。</em>上周体检，医生看着报告问了一句："你这个工作，是不是没法按时吃饭？"',
 o:[
  {t:'把夜间应急交出去，白天的现场自己去', h:'<i>-津贴</i>',
   r:'你把夜间值班交给了年轻人，自己只跑白天。头几个月还是不放心，半夜爬起来去过三次。半年后你发现，他们做得比你想的好。这个认识让人失落，也让人松了一口气。',
   fx:{cash:-0.5, body:14, sys:-2, flag:'rg_lighter'}},
  {t:'撑着。这两年正是关键期', h:'<i>前途</i>',
   r:'你撑到了副局长的任命下来。第十六年春天你在一次夜间处置的现场晕倒，送医住了九天。你爱人在医院走廊里跟你说："那个位子有那么重要吗？"你没有回答。',
   fx:{body:-12, sys:5, flag:'rg_burnout'}},
  {t:'借这个机会把全科的健康和值班问题一起提出来', h:'<i>得罪人</i>',
   r:'你把全科七个人三年的加班、值班和体检数据整理成一份材料报了上去。市局第二年给基层执法队伍增了编制，还配了体检加项。你们科的人不知道这件事是你做的。',
   fx:{cash:-0.5, body:10, sys:-4, morale:8, pub:4, flag:'rg_welfare'}}
 ]},

{y:13, s:'春', who:'ld', title:'副局长的位子', cost:2, key:1,
 ig:{t:'位子给了一个从市局下来的人。他不熟悉片区，凡事按流程。往后两年，你报上去的案子平均要多走十八天。', fx:{sys:-6, flag:'rg_noVP'}},
 t:'刘局退了，副局长的位子空出来。<em>你的业务是全局最好的，但你得罪的人也是最多的。</em>这个位子给你，你要想清楚：上去了，你就不只是查案子的人了。',
 o:[
  {t:'上。有些事只有在那个位置上才改得动', h:'<i>+收入</i> · 也从此要平衡',
   r:'你上任第一年就批了两件自己五年前会反对的事：一次限期从宽，一次不予立案。你在会上说服自己的理由，跟当年刘局说服你的理由一模一样。你在办公室坐到很晚，想起第一年老鲁带你去红星那天，你在下风口闻到的那股味儿。',
   fx:{cash:3.6, sys:12, law:-2, guilt:1, flag:'rg_vp'}},
  {t:'上，但要求继续分管执法', h:'<i>难谈</i> · 两样都要',
   r:'你争到了继续分管一线执法。这在局里不合惯例，因为副局长通常分管综合和法制。你干得很累，但你保住了那条能碰到现场的通道。第十五年那次跨省联合行动，是你亲自带的队。',
   fx:{cash:3.6, sys:10, law:5, pub:5, body:-8, flag:'rg_vp2'}},
  {t:'不上。我想在业务上干到底', h:'<i>纯粹</i> · 也从此没有话语权',
   r:'你婉拒了。往后几年你是全局最懂业务的人，也是最没有决定权的人。执法计划、案件定性、裁量幅度，你的意见只是"一个意见"。第十五年你有一个很好的判断，被压了半年。',
   fx:{law:10, pub:6, sys:-8, flag:'rg_noVP'}}
 ]},

{y:13, s:'夏', who:'cz', title:'红星要搬迁了', cost:2, key:1,
 ig:{t:'搬迁按企业的方案走了。老厂区的土壤调查是搬完之后才做的，查出三处污染，责任认定扯了两年。', fx:{risk:3, pub:-5, guilt:2}},
 t:'方科，集团决定把红星整体搬到新园区。<em>老厂区这块地要交回去做商住。</em>手续上您这边需要出土壤污染状况调查的意见。我们希望能快一点。',
 o:[
  {t:'先做详细调查再谈交地，一步不省', h:'<i>要拖半年</i>',
   r:'你坚持先做详查。查出两处超标，一处是二十年前的老储罐区。修复花了企业一千一百万，工期拖了八个月。集团给市里打过电话。第十六年那块地做了住宅，交付前的复核一次通过。你签的那份意见，用了很多年也没有出过问题。',
   fx:{law:9, pub:10, sys:-6, risk:-4, money:-40, flag:'rg_soil'}},
  {t:'按常规程序办，该多久多久', h:'<i>规矩</i>',
   r:'调查做了，是常规精度。结论是"未发现明显污染"。第十六年那块地建了住宅。你偶尔会想起那个老储罐区，但报告上没有写它，你也没有再提。',
   fx:{sys:4, guilt:2, risk:1, flag:'rg_routine_soil'}},
  {t:'加快流程，但要求企业出具终身责任承诺', h:'<i>折中</i> · 责任往后推',
   r:'交地很顺利，企业签了终身责任承诺书。第十六年施工挖出了异味土，责任按承诺书追到了企业头上。企业认了，也修了。但那半年附近的居民一直在投诉，而承诺书对他们来说什么也不是。',
   fx:{sys:6, pub:-4, risk:1, flag:'rg_promise'}}
 ]},

{y:13, s:'秋', who:'reg', title:'你带的年轻人问你', cost:1,
 ig:{t:'那个年轻人一年后调去了综合科。他跟人说：现场那摊活，干得再好也没人看见。', fx:{morale:-4, law:-2}},
 t:'方科，我来三年了。<em>我发现干得多的人挨骂最多，写材料的人升得最快。</em>我想问您一句：您后悔当年选执法这条线吗？',
 o:[
  {t:'跟他讲这十三年真实的样子，好的坏的都讲', h:'<i>他可能会走</i>',
   r:'你讲了两个小时，包括那年的一刀切、那三十七个工人、那个搬走的投诉人，也讲了那个夜里逮到的排口和那面锦旗。他听完说："听起来挺难的。"你说："是难。但每一件难的事做完，都留下了东西。"他留了下来。',
   fx:{law:3, pub:5, morale:6, flag:'rg_answer'}},
  {t:'跟他说实话：想升官别在这个岗位上待', h:'<i>诚实到有点残忍</i>',
   r:'你劝他去综合科或者法制科。他半年后调走了，三年后提了副科。他每次见到你还是叫师傅。这件事你不后悔，但你也知道，一线又少了一个能干的人。',
   fx:{law:-2, sys:2, morale:-3, pub:2, flag:'rg_sendoff'}},
  {t:'画个饼：好好干，会有机会的', h:'<i>省事</i> · 你自己都不信',
   r:'你说了些鼓励的话，说完自己都觉得空。他点点头走了，一年后还是调走了。这件事让你想起第一年有人也这么跟你说过——那时候你信了，还信了好几年。',
   fx:{morale:-4, guilt:1, law:-2}}
 ]},

{y:14, s:'春', who:'ld', title:'一起十四年前的旧案被翻出来', cost:2, key:1,
 need:function(s){ return (s.guilt || 0) >= 5 || !!s.flag.rg_hush || !!s.flag.rg_bury63; },
 ig:{t:'专项审计出了一份"关注事项"，写进了年度报告。没有处理任何人，但它记在那儿了。', fx:{sys:-6, guilt:2, report:1}},
 t:'省里搞执法案卷交叉评查，<em>抽到了你们片区，其中一件是当年那个"到此为止"的处理。</em>评查组问：为什么当时没有立案，也没有任何说明材料。',
 o:[
  {t:'如实说明当时的判断和处理，承担责任', h:'<i>会被处理</i> · 但账清了',
   r:'你写了一份四页的说明，讲清楚当时的考虑和缺失。评查组认定为"处理不当、程序缺失"，给了你诫勉谈话。这件事进了档案。但从那以后，你片区所有的不予立案都必须附书面理由，这条规矩后来被全市采纳。',
   fx:{law:5, pub:6, sys:-8, guilt:-6, flag:'rg_owned'}},
  {t:'补一份当时的情况说明', h:'<i>补得上</i> · 但补的是纸',
   r:'你写了一份日期倒签的说明。评查组没有再问。这件事过去了。此后每次案卷评查你都要先翻一遍那几年的旧案，翻的时候手心是出汗的。',
   fx:{sys:2, guilt:4, report:1, flag:'rg_backdate'}},
  {t:'把那几年所有的不予立案案件一起自查一遍', h:'<i>可能查出更多</i>',
   r:'你主动把六年的不予立案案件全部翻了一遍，找出三件缺失说明的，一起报了上去。评查组的结论是"存在瑕疵，但属地自查主动"。刘局退休前听说了这件事，给你发了一条消息，只有四个字：做得对。',
   fx:{law:6, pub:8, sys:-4, guilt:-8, flag:'rg_selfaudit'}}
 ]},

{y:14, s:'夏', who:'chen', title:'红星拿了国家级绿色工厂', cost:1,
 ig:{t:'牌子挂上了。分局没有派人去，也没有人提起这件事跟这十四年的执法有什么关系。', fx:{pub:-2}},
 t:'方科，牌子下来了。<em>我们想请您去挂牌仪式上讲两句。</em>说实话，这十四年里让我们真正改起来的，不是奖励，是您那几次罚单和那本指引。',
 o:[
  {t:'去，但只讲事实：这个厂被罚过几次，改了什么', h:'<i>不给面子</i> · 也是最实在的祝贺',
   r:'你在台上讲了七分钟，讲了三次处罚、四次整改、两次半夜的现场。台下很安静。讲完许厂长带头鼓了掌。这段讲话被人录了下来，在市里的执法培训上放过很多次。',
   fx:{law:4, pub:11, sys:5, fame:5, aff:{cz:4, chen:5}, flag:'rg_speech'}},
  {t:'不去。执法部门不该给企业站台', h:'<i>规矩</i>',
   r:'你回绝了，理由说得很得体。这件事在企业圈子里被理解成了"分局跟红星有过节"。半年后另一家企业申报，主动来问你们"需要打点什么"。你把他们请了出去。',
   fx:{sys:3, pub:-4, law:2}},
  {t:'去，说几句场面话', h:'<i>皆大欢喜</i>',
   r:'你讲了五分钟，很得体，也很空。散场的时候陈工小声说了句："我还以为您会讲那三次罚单。"你说下次吧。没有下次了。',
   fx:{pub:2, fame:3, sys:2}}
 ]},

{y:14, s:'秋', who:'reg', title:'有人想让你出具一份证明', cost:2,
 ig:{t:'那份证明你没有出。那家企业找了别的渠道，最后还是拿到了类似的材料。你什么也没有做，但你什么也没有阻止。', fx:{pub:-2, guilt:1}},
 t:'一家企业要申报绿色信贷，<em>需要一份"近三年无环境违法记录"的证明。他们两年前被罚过一次，金额不大。</em>来说情的是你的一位老同学。',
 o:[
  {t:'照实出：有一次处罚，情节轻微，已整改到位', h:'<i>可能贷不下来</i>',
   r:'你出了一份如实的证明，同时附了整改验收的材料。银行看完之后认可了，贷款批了，利率高了一点。那家企业的老板后来专门来道过谢——他说他本来以为写了处罚就完了。',
   fx:{law:5, pub:8, sys:3, flag:'rg_truthcert'}},
  {t:'不出。这种证明我们不该出', h:'<i>规矩</i> · 也断了人家的路',
   r:'你按规定回复"我局不出具此类证明"。那家企业最后没有拿到贷款，第二年缩减了产能。这件事程序上完全正确。那位老同学从此没有再联系过你。',
   fx:{sys:4, pub:-3, law:2}},
  {t:'出一份"无重大环境违法"的证明', h:'<i>一个词的差别</i>',
   r:'你把"无"改成了"无重大"，技术上说得通。贷款批了。第十六年这家企业出了一起事故，银行追溯尽调材料的时候，这份证明被翻了出来。没有认定你的责任，但那两个字是你加的。',
   fx:{guilt:4, sys:2, pub:-2, report:1, flag:'rg_softcert'}}

function engTick(y){
  var f = S.flag, facSum = 0, k;
  for(k in S.fac) facSum += S.fac[k];

  /* ── 你的收入 ── */
  var pay = 5.2 + (S.pro || 0) * 0.035 + (S.say || 0) * 0.022 + y * 0.28;
  if(f.eng_lead) pay += 2.4;
  if(f.eng_vp || f.eng_vp2) pay += 4.0;
  if(f.cert) pay += 3.6;
  if(f.em_cert) pay += 0.6;
  if(f.moonlight) pay += 2.4;
  var bonus = (S.money > 60 && S.orders > 50) ? 1.2 : 0.4;   /* 全厂效益奖 */
  bonus += facSum * 0.14;                                     /* 节能技改专项奖 */
  if((S.risk || 0) === 0) bonus += 0.3;                       /* 安全环保零处罚奖 */
  if(f.my_gf && !f.gf_paid){ bonus += 2.0; S.flag.gf_paid = true; }
  /* ── 你的开销 ── */
  var spend = 6.4 + y * 0.34;
  if(f.married || f.late_marry) spend += 1.6;
  if(f.mortgage) spend += 3.6;
  else if(f.rent_school) spend += 4.0;
  else if(f.my_rent) spend += 1.4;
  else if(f.eng_dorm) spend -= 1.0;
  if((S.body || 60) < 40) spend += 0.8;
  var net = Math.round((pay + bonus - spend) * 10) / 10;
  S.cash = Math.round(((S.cash || 0) + net) * 10) / 10;

  /* 技术是会过时的：不学新东西，专业每年往下掉一点 */
  S.pro = pct((S.pro || 0) - (f.cert || f.my_paper || f.my_lab ? 0.9 : 1.7));
  S.say = pct((S.say || 0) + 0.8);          /* 待得久，多少有点分量 */

  /* ── 这座厂自己也在走 ── */
  if(f.pv_own || f.my_pv) S.smoke = pct(S.smoke - 1.2);
  if(f.heat || f.my_heat || f.my_motor) S.smoke = pct(S.smoke - 0.5);
  S.smoke = pct(S.smoke - 0.5);
  S.orders = pct(S.orders + 1.6);
  S.rival = Math.min(150, S.rival + 2.4);
  var earn = Math.round(13 + S.orders * 0.26 - S.smoke * 0.13);
  S.money += Math.max(-16, Math.min(30, earn)) - 4;
  if(y % 4 === 0 && facLv('water') === 0 && facLv('air') === 0) S.risk = Math.min(12, (S.risk || 0) + 1);
  S.body = pct((S.body || 60) - 1.2 - (y >= 10 ? 0.8 : 0));

  /* ── 年终那句话 ── */
  var note;
  if(net < 0) note = '这一年是倒贴的。你把存折翻出来看了一眼，又放了回去。';
  else if((S.guilt || 0) >= 6) note = '钱是涨了一点。只是这一年你签过几个自己不太愿意想起的字，它们不在任何一张表上。';
  else if((S.body || 60) < 36) note = '收入比去年好。你爱人在饭桌上说了句"钱是挣了，人快没了"，你没接话。';
  else if(f.cert && net >= 5) note = '有证之后，同样的活价钱不一样了。这一年你第一次觉得，那九个月的晚上是有回报的。';
  else if((S.say || 0) >= 62) note = '今年提的方案批了三个，驳回一个。这在五年前是不敢想的。';
  else if((S.ind || 0) >= 60) note = '外面开始有人找你了。厂里的位置没变，但你知道自己的处境变了。';
  else if((S.say || 0) <= 26) note = '你今年提了四份方案，批了零份。技术这东西，说得对没有用，得说得动。';
  else note = '不算好也不算坏的一年。工资条上的数字比去年多了一点点。';

  var extra = '';
  if((S.risk || 0) >= 5) extra += '<p style="font-size:13.5px;color:var(--brick)">厂里挂着的问题越来越多了。你手上那份隐患清单，划掉一条，又添两条。</p>';
  if(S.money < -40) extra += '<p style="font-size:13.5px;color:var(--brick)">厂里今年又亏了。老赵在会上说，明年所有非生产性开支一律压缩——这句话你听得懂，说的就是你那摊。</p>';
  if(f.my_gf && S.flag.gf_paid && y === 14) extra += '<p style="font-size:13.5px;color:var(--dado)">绿色工厂的奖励下来了，厂里给相关人员发了一笔奖金，你那份是两万。</p>';
  return {big:net, abs:Math.abs(net).toFixed(1) + ' 万',
          cap:'你今年的进账　·　存款现在 ' + (S.cash || 0).toFixed(1) + ' 万',
          note:note, extra:extra};
}

function engReveal(cutv){

  return [
   ['你的存款', (S.cash || 0).toFixed(1) + ' 万'],
   ['专业', word(S.pro, STAT.pro.w)],
   ['厂里听不听你的', word(S.say, STAT.say.w)],
   ['圈里知不知道你', word(S.ind, STAT.ind.w)],
   ['身体', word(S.body || 60, STAT.body.w)],
   ['心里的账', (g === 0 ? '一件也没有' : g <= 2 ? '有一两件事' : g <= 5 ? '有几件事你不想再想' : g <= 8 ? '压着不少' : '很沉')],

function engClosing(cutv){
  var g = S.guilt || 0, f = S.flag;
  if(g >= 8) return '这十五年你做成的事，比大多数人都多。可有几件事你比谁都清楚：它们不写在任何一份材料上，只写在你自己这儿。做对九十九件，抵不掉那一件——这不是道德说教，这是这个行业的规矩。';
  if(f.my_told || f.my_rebuild) return '你把自己做过的事说出来的那一天，是这十五年里最难的一天，也是最轻的一天。这个行业里，能把旧账翻出来自己认领的人，不多。';
  if(f.cert && S.ind >= 60) return '这张证不是让你多挣多少钱，它是让你在有人要你签一个不该签的字的时候，敢说"我不签"。有些人一辈子没拿到这个底气。';
  if(cutv >= 45 && g <= 2) return '这座厂的烟囱淡了将近一半，没有哪一年是靠一个决定完成的。它是十五年里几十个小选择加起来的结果——而当时每一个看起来都不重要。';
  if(S.say <= 28) return '你说的每一句都是对的，但对的话没有人听，跟没说过是一样的。这不是你的错，可它确实是你的十五年。';
  if(cutv >= 20) return '你推动的那些事，多数是顺手的：换台电机、补个漏点、装几块表。真正难的那几步，你提过，但没有争到底。';
  return '十五年过去，那根烟囱几乎没变。不是你不想，是每一次到了要花钱的时候，总有更急的事排在前面——技术员的无力感，大概就是这个。';
}

function wkTick(y){
  var f = S.flag;
  /* ── 工资条 ── */
  var pay = 5.2 + (S.skill || 0) * 0.030 + y * 0.22;
  var ot = f.ot_hard ? 2.0 : 1.1;
  if(f.wk_dayshift || f.wk_dayshift2 || f.wk_lighter || f.wk_transfer) ot = 0.35;
  if(f.wk_lead) pay += 0.9;
  if(f.wk_boss) pay += 1.8;
  if(f.tech_cert) pay += 0.72;
  if(f.wk_elec) pay += 0.3;
  if(f.wk_toxic && !f.wk_transfer && !f.wk_lighter) pay += 0.36;
  var bonus = (S.money > 60 && S.orders > 50) ? 0.8 : 0.25;
  if(f.wk_stole) bonus = 0;                      /* 处分在身，年终奖没有你的份 */
  /* ── 家里的账 ── */
  var spend = 5.4 + y * 0.26;
  if(!(f.wk_married || f.wk_late_marry)) spend += 0.8;   /* 往老家寄的 */
  if(f.wk_married || f.wk_late_marry) spend += 1.2;
  if(f.wk_kid) spend += 0.9;
  if(f.wk_house_city) spend += 2.6;
  else if(f.wk_house_near) spend += 1.4;
  else if(f.wk_nohouse || f.wk_kid) spend += 1.0;
  if(f.wk_school_city) spend += 0.8;
  if(f.wk_solo_income) spend += 1.8;
  if(f.wk_debt && y <= 8) spend += 0.8;
  if((S.body || 60) < 40) spend += 0.6;
  var net = Math.round((pay + ot + bonus - spend) * 10) / 10;
  S.cash = Math.round(((S.cash || 0) + net) * 10) / 10;

  /* ── 人和厂都在旧下去 ── */
  var wear = 1.4 + (f.ot_hard ? 0.8 : 0) + (y >= 10 ? 0.6 : 0);
  if(f.wk_lighter || f.wk_transfer || f.wk_dayshift2) wear -= 1.2;
  S.body = pct((S.body || 60) - wear);
  S.skill = pct((S.skill || 0) - 0.5);        /* 手艺会生疏，但不会凭空消失 */
  S.favor = pct((S.favor || 0) + 0.6);        /* 干得久，厂里多少认你一点 */
  S.smoke = pct(S.smoke - 0.6 - (f.pv_own ? 1.0 : 0));
  S.orders = pct(S.orders + 1.4);
  S.rival = Math.min(150, S.rival + 2.4);
  S.money += Math.max(-16, Math.min(28, Math.round(12 + S.orders * 0.24 - S.smoke * 0.12))) - 4;
  if(y % 4 === 0 && facLv('air') === 0) S.risk = Math.min(12, (S.risk || 0) + 1);

  /* ── 年终那句话 ── */
  var note;
  if(net < 0) note = '这一年是往里贴的。存折上的数字比去年小，你把它翻过去，没让家里看见。';
  else if((S.mates || 0) <= 22) note = '钱不少。只是今年食堂里，很少有人主动跟你坐一桌。';
  else if((S.body || 60) <= 32) note = '收入还行。爬三楼要歇一次这件事，你没跟任何人说过。';
  else if((S.favor || 0) >= 68) note = '厂里今年又表扬了你。你把奖状卷起来塞进了柜子，没往家里带。';
  else if(f.tech_cert && (S.skill || 0) >= 65) note = '有证、有手艺，车间里的活没有你干不了的。这一点让你踏实。';
  else if((S.skill || 0) <= 30) note = '新上的那些设备你已经跟不上了。班组里有个刚来两年的小孩，比你会调参数。';
  else if(net >= 3) note = '今年攒下了一点。你在存折上算了一遍，离那个数还差得远。';
  else note = '不算好也不算坏的一年。工资涨了一点，物价也涨了一点。';

  var extra = '';
  if((S.mates || 0) <= 18) extra += '<p style="font-size:13.5px;color:var(--brick)">班前会上你一开口，没有人接话。这个状态已经持续了一段时间了。</p>';
  if((S.favor || 0) <= 18) extra += '<p style="font-size:13.5px;color:var(--brick)">今年的考核你又是"基本称职"。人事那位跟你说话的时候，没有抬头。</p>';
  if((S.body || 60) <= 26) extra += '<p style="font-size:13.5px;color:var(--brick)">右手拿扳手的时候会抖。你换了左手，慢一点，但看不出来。</p>';
  if(f.wk_kid && y === 12) extra += '<p style="font-size:13.5px;color:var(--ink-2)">孩子这学期的成绩单拿回来了。你看了很久，一句也没说。</p>';
  return {big:net, abs:Math.abs(net).toFixed(1) + ' 万',
          cap:'你今年攒下的　·　存款现在 ' + (S.cash || 0).toFixed(1) + ' 万',
          note:note, extra:extra};
}

function slTick(y){
  var f = S.flag;
  /* ── 底薪＋提成（提成按回款算，应收越高扣得越狠） ── */
  S.ar = Math.max(0, S.ar || 0);
  var base = 3.6 + y * 0.20;
  if(f.sl_lead) base += 1.4;
  if(f.sl_director) base += 3.0;
  var comm = (S.cust || 0) * 0.10 + (S.orders || 0) * 0.042;
  comm -= (S.ar || 0) * 0.050;                      /* 钱没回来，提成就不算数 */
  if(f.sl_kickback) comm += 1.4;
  comm = Math.max(-1.2, comm);
  var spend = 5.8 + y * 0.28;
  if(f.sl_married) spend += 1.4;
  if(f.sl_kid) spend += 1.6;
  if(f.sl_kid_far || f.sl_batch) spend += 0.6;      /* 请人接送、来回机票 */
  if((S.body || 60) < 40) spend += 0.7;
  var net = Math.round((base + comm - spend) * 10) / 10;
  S.cash = Math.round(((S.cash || 0) + net) * 10) / 10;

  /* ── 应收自己会回来一点，也会自己烂掉一点 ── */
  S.ar = Math.max(0, (S.ar || 0) * (f.sl_creditrule || f.sl_cashrule ? 0.62 : 0.78));
  if((S.ar || 0) > 60 && Math.random() < 0.3){ var bad = Math.round(S.ar * 0.25); S.ar -= bad; S.money -= bad; }

  /* ── 厂子在走 ── */
  S.smoke = pct(S.smoke - 0.7 - (f.pv_own ? 1.0 : 0));
  S.orders = pct(S.orders + 1.2 + ((S.cust || 0) >= 60 ? 1.4 : 0));
  S.cust = pct((S.cust || 0) - 0.7);                /* 客户是会跑的，不维护就没了 */
  S.rival = Math.min(150, S.rival + 2.4);
  S.money += Math.max(-16, Math.min(30, Math.round(12 + S.orders * 0.26 - S.smoke * 0.12))) - 4;
  S.body = pct((S.body || 60) - 1.6 - (f.sl_push ? 1.2 : 0) - (y >= 10 ? 0.6 : 0) + (f.sl_health || f.sl_shift || f.sl_rest ? 1.4 : 0));
  if(y % 4 === 0 && facLv('air') === 0) S.risk = Math.min(12, (S.risk || 0) + 1);

  var note;
  if(net < 0) note = '这一年的提成是负的。回款没到，签的单再多也不算数——这个道理你是用工资条学会的。';
  else if((S.ar || 0) >= 60) note = '签了不少，钱没回来多少。老赵看你的眼神一年比一年复杂。';
  else if((S.guilt || 0) >= 6) note = '收入涨了。有几件事你不太愿意想起来，它们不在任何一张报表上。';
  else if((S.body || 60) < 36) note = '业绩很好。胃疼了大半年，你一直说忙过这阵就去查。';
  else if((S.ind || 0) >= 62) note = '同行开始有人来问你怎么做的了。厂里的位置没变，但你知道自己的处境变了。';
  else if((S.cust || 0) <= 28) note = '手上的客户越来越少。这一行最怕的不是被拒绝，是电话打过去没人接。';
  else note = '不算好也不算坏的一年。签了几单，丢了几单，日子往前走。';

  var extra = '';
  if((S.ar || 0) >= 80) extra += '<p style="font-size:13.5px;color:var(--brick)">应收账款又涨了。老赵在会上说："再这么下去，我们是在给客户免费当银行。"</p>';
  if(S.money < -40) extra += '<p style="font-size:13.5px;color:var(--brick)">厂里今年亏了。老许在会上说，明年销售费用压缩两成。</p>';
  if((S.body || 60) <= 28) extra += '<p style="font-size:13.5px;color:var(--brick)">胃药从抽屉里换到了包里。你已经很久没有吃过一顿正经的早饭。</p>';
  return {big:net, abs:Math.abs(net).toFixed(1) + ' 万',
          cap:'你今年到手的　·　存款现在 ' + (S.cash || 0).toFixed(1) + ' 万',
          note:note, extra:extra};
}

function rgTick(y){
  var f = S.flag;
  /* ── 工资条：稳定、可预期、也基本看得到头 ── */
  var pay = 7.0 + y * 0.30 + (S.sys || 0) * 0.012;
  if(f.rg_lead) pay += 1.8;
  if(f.rg_vp || f.rg_vp2) pay += 3.4;
  if(f.rg_cert) pay += 0.6;
  if(f.rg_desk || f.rg_lighter) pay -= 0.5;          /* 离开一线，津贴少一截 */
  var grey = f.rg_take ? 1.8 : 0;                     /* 那条路一旦走上，就不是一次的事 */
  var spend = 5.6 + y * 0.28;
  if(f.rg_married || f.rg_latemarry) spend += 1.3;
  if(f.rg_kid_far || f.rg_mortgage) spend += 2.2;
  else if(f.rg_rent2) spend += 4.0;
  else if(f.rg_smallhouse) spend += 1.2;
  if((S.body || 60) < 40) spend += 0.7;
  var net = Math.round((pay + grey - spend) * 10) / 10;
  S.cash = Math.round(((S.cash || 0) + net) * 10) / 10;
  if(grey && y % 2 === 0) S.guilt = Math.min(12, (S.guilt || 0) + 1);

  /* ── 辖区在走：你管得住的和管不住的 ── */
  var press = 0;
  if((S.law || 0) >= 60) press += 1;
  if(f.rg_manual || f.rg_guide || f.rg_teach) press += 1;
  if(f.rg_prefix || f.rg_tiered) press += 1;
  S.smoke = pct(S.smoke - 0.5 - press * 0.7);
  S.risk = Math.max(0, Math.min(12, (S.risk || 0) + (press >= 2 ? -1 : (y % 3 === 0 ? 1 : 0))));
  S.orders = pct(S.orders + 1.2);
  S.money += Math.max(-16, Math.min(28, Math.round(12 + S.orders * 0.24 - S.smoke * 0.12))) - 4;
  S.cases = (S.cases || 0) + (f.rg_lead || f.rg_vp || f.rg_vp2 ? 3 : 2);
  S.body = pct((S.body || 60) - 1.5 - (y >= 10 ? 0.6 : 0) + (f.rg_desk || f.rg_lighter ? 1.6 : 0));
  S.sys = pct((S.sys || 0) + 0.5);                    /* 熬年头也是资历 */

  var note;
  if((S.guilt || 0) >= 7) note = '收入比同事高一截，理由你自己清楚。这几年你每次听见"廉政谈话"四个字，心跳都会快一点。';
  else if((S.sys || 0) <= 22) note = '年度考核又是"称职"。写材料的那几个都提了，你还在原地。';
  else if((S.pub || 0) >= 68) note = '企业和居民那边的评价越来越好。这个东西不进考核，但它让你半夜出现场的时候没那么难受。';
  else if((S.pub || 0) <= 24) note = '这一年你办的案子不少。片区里说起分局，用的词是"他们只会罚款"。';
  else if((S.body || 60) < 36) note = '血压又高了。夜里的电话你已经能在响第一声之前醒过来。';
  else if((S.law || 0) >= 70) note = '现在片区里有疑难案子，局里第一个想到的是你。这是本事，也是没完没了的活。';
  else note = '不算好也不算坏的一年。案子办了几件，投诉回了几件，日子往前走。';

  var extra = '';
  if((S.risk || 0) >= 6) extra += '<p style="font-size:13.5px;color:var(--brick)">辖区里挂着的问题越来越多。你手上那张隐患清单，销掉一条，又添两条。</p>';
  if((S.pub || 0) <= 20) extra += '<p style="font-size:13.5px;color:var(--brick)">今年的营商环境评议，你们分局在全市排倒数第二。有企业在评议表上写了一句："只罚不管。"</p>';
  if((S.sys || 0) >= 74) extra += '<p style="font-size:13.5px;color:var(--dado)">市局把你们片区的做法发文推广了一次。刘局在会上念了你的名字。</p>';
  return {big:net, abs:Math.abs(net).toFixed(1) + ' 万',
          cap:'你今年攒下的　·　存款现在 ' + (S.cash || 0).toFixed(1) + ' 万',
          note:note, extra:extra};
}

function rgAfterlife(){
  var f = S.flag, A = S.aff, out = [];
  var shi;
  if(f.rg_mentor)          shi = '返聘做了六年顾问才真的退。他跟人说这辈子最得意的事，是把那本笔记交对了人。';
  else if(f.rg_finish63)   shi = '退休了。你把查实五十七条的事告诉他那天，他在电话里没说话，过了很久说了句"值了"。';
  else if(f.rg_notebook)   shi = '退休了，回了老家。那本笔记你还留着，他没有再问过。';
  else if(f.shi_gone)      shi = '退休了。他那本记了二十年的笔记，后来被当作旧材料清理掉了。';
  else                     shi = '退休了。每年老同志座谈会上还能见到，他还是那句："下车先站到下风口闻一闻。"';
  out.push(['shi', '老鲁', shi]);

  var ld;
  if(f.rg_refuse_quota)    ld = '退休了。那年他替你扛下了一票否决的通报，考核降了一档，一句怨言没有。';
  else if(f.rg_honest_talk)ld = '退休了。那次谈话之后你们又见过几次，聊的都是二十年前的案子。';
  else if(f.rg_onesize)    ld = '退休了。那年冬天的事，你们两个人都清楚，谁也没有再提。';
  else                     ld = '退休了。走的时候把那本翻烂的执法手册留给了你。';
  out.push(['ld', '刘局', ld]);

  var cz;
  if(f.rg_endorse)         cz = '第十六年调去了集团。他跟人提起你的时候说："那份推荐意见写了我们三次处罚，我一开始想找他，后来想通了。"';
  else if(f.rg_nightcatch) cz = '调走了。夜里关设施那次之后，红星再没有出过同类问题。他见你还是客气，但从来不多说一句。';
  else if(f.rg_dine)       cz = '调走了。那顿 AA 的饭他记了很多年，说那是他见过最不像饭局的饭局。';
  else                     cz = '调走了。这十五年你跟他打过的交道，加起来不超过二十次，每一次都在正式场合。';
  out.push(['cz', '许厂长', cz]);

  var chen;
  if(f.rg_selfreport)      chen = '还在红星管技术。他主动报告那件事之后，成了全市企业里第一个敢这么干的人。';
  else if(f.rg_help || f.rg_worstcase) chen = '还在红星管技术。他跟人说过：这个片区能有今天，一半是罚出来的，一半是教出来的。';
  else if(f.rg_maxpunish)  chen = '还在红星。那次顶格处罚之后，他再没有主动跟分局说过任何事。';
  else                     chen = '还在红星管技术。你们打过很多次交道，都是在检查的时候。';
  out.push(['chen', '陈工', chen]);

  var min;
  if(f.rg_closure || f.rg_sorry) min = '搬走了。他后来在业主群里说过一句："那十年里，唯一半夜来过我家阳台的，是分局那个小方。"';
  else if(f.rg_source)     min = '没有搬走。他儿子的哮喘从第五年起就很少发作了，他自己也说不清是哪一年开始的。';
  else if(f.rg_night1)     min = '搬走了。走之前给你打过一个电话，说的是"谢谢你至少来过"。';
  else                     min = '搬走了。他一共投诉过二十七次，你接过其中十一次。';
  out.push(['min', '那个投诉人', min]);
  return out;
}

function rgReveal(cutv){
  var d = rgDone();
  return [
   ['你的存款', (S.cash || 0).toFixed(1) + ' 万'],
   ['业务', word(S.law || 0, STAT.law.w)],
   ['上面怎么看你', word(S.sys || 0, STAT.sys.w)],
   ['外面怎么看你', word(S.pub || 0, STAT.pub.w)],
   ['身体', word(S.body || 60, STAT.body.w)],
   ['心里的账', ((S.guilt||0) === 0 ? '一件也没有' : (S.guilt||0) <= 2 ? '有一两件事' : (S.guilt||0) <= 5 ? '有几件事你不想再想' : (S.guilt||0) <= 8 ? '压着不少' : '很沉')],
   ['十五年办结', (S.cases || 0) + ' 件'],
   ['你辖区里那根烟囱，淡了', cutv + '%'],
   ['红星厂还留着的隐患', (S.risk === 0 ? '一处都没有' : S.risk <= 2 ? '有一些' : S.risk <= 4 ? '不少' : '积重难返')],
   ['这十五年你真正推动过的事', d.length + ' 件']
  ];
}

function rgClosing(cutv){
  var f = S.flag;
  if((S.guilt||0) >= 8) return '这一行的权力不大，但它有一个特点：它的全部价值，在于它不能被买。你收过的每一笔钱，买走的不只是那一次不查，是你之前所有认真查过的那些次。';
  if(f.rg_onesize && S.pub <= 34) return '一刀切从来不是因为执法者坏，是因为它最安全：指标完成了，责任没有了，代价由别人承担。你签那个字的时候三十三岁，你知道它意味着什么。';
  if(f.rg_manual || f.rg_teach) return '罚款是最容易的那一半。难的那一半是让企业知道该改成什么样——这件事不在你的考核指标里，也没有人要求你做。你做了十五年。';
  if(S.pub >= 66 && S.sys <= 34) return '你在企业和居民那儿是有分量的，在系统里没有。这个片区的空气因为你好了一些，你的职级因为你停了下来。这两件事都是真的。';
  if(cutv >= 35) return '这片园区的烟囱淡了不少。这里面有企业花的钱、有工程师熬的夜，也有你半夜站在下风口的那些次。没有人会把这些算到你头上。';
  if((S.cases||0) >= 46 && S.pub <= 44) return '办结件数是这一行唯一能被统计的东西，所以它慢慢变成了唯一重要的东西。你比谁都清楚这不对，但你还是这么干了十五年。';
  return '基层执法最难的地方，是你手上的权力足以毁掉一家企业，却不足以让一条河变干净。这两件事之间的落差，就是这十五年。';
}

function rgCard(e){
  return GAME + ' · 监管员｜' + (S.name || '小方') + '｜结局：' + e.n.replace(/[《》]/g, '')
    + '｜办结 ' + (S.cases || 0) + ' 件 · 推动 ' + rgDone().length + ' 件事'
    + '｜' + word(S.sys||0, ['上面重点培养','上面放心用','上面一般般','上面有意见'])
    + '、' + word(S.pub||0, ['外面服气','外面认可','外面有说法','外面怨声载道']);
}

function totalProgress(){
  var got = 0, all = 0;
  ROLE_ORDER.forEach(function(id){
    var r = ROLES[id]; if(!r) return;
    all += r.endings.length;
    try{ got += (JSON.parse(localStorage.getItem('ty_end_' + r.id) || '[]') || []).length; }catch(e){}
  });
  return {got:got, all:all};
}

function wipeProgress(){
  if(!confirm('清空之后，五条线已解锁的结局记录都会消失，且无法恢复。确定吗？')) return;
  ROLE_ORDER.forEach(function(id){ try{ localStorage.removeItem('ty_end_' + id); }catch(e){} });
  roleSelect();
}
function roleSelect(){
  app.onclick = null;
  var body = ROLE_ORDER.map(function(id){
    var r = ROLES[id];
    if(!r){
      var soon = SOON[id]; if(!soon) return '';
      return '<div class="rcard soon">' + FACE[soon.face]
        + '<div><div class="rn">' + (soon.who || soon.n) + '<span class="rlock">还在写</span></div>'
        + '<div class="rt">' + soon.tag + '</div>'
        + '<div class="rd">' + soon.desc + '</div></div></div>';
    }
    var done = 0;
    try{ done = (JSON.parse(localStorage.getItem('ty_end_' + r.id) || '[]') || []).length; }catch(e){ done = 0; }
    return '<button class="rcard" onclick="startRole(\'' + r.id + '\')">' + FACE[r.face]
      + '<div><div class="rn">' + (r.who || r.n) + '</div>'
      + '<div class="rt">' + r.tag + '</div>'
      + '<div class="rd">' + r.desc + '</div>'
      + '<div class="rs">' + r.scale
      + (done ? '　·　已解锁 <b>' + done + '/' + r.endings.length + '</b> 个结局' : '') + '</div></div></button>';
  }).join('');
  app.innerHTML = skyline()
    + '<div class="ttl"><h1>' + GAME + '</h1><div class="sub">同一座工厂　五个位置　五种活法</div></div>'
    + '<div class="roles"><p class="lead">二〇二六年春天，红星化工三厂。</p>'
    + '<p class="hint">四百多号人、三条产线、一根从早冒到晚的烟囱。接下来的十五年，这座厂会变成什么样，'
    + '取决于很多人的很多个决定——<b>你可以挑一个人，从他的位置上走一遍</b>。<br>'
    + '十五年后，这座厂会拿到一张按《绿色工厂评价通则》十五项指标打出来的成绩单。'
    + '同一段十五年，换个身份看，好人和坏人往往会换个位置。</p>'

    + '<button class="lnk" onclick="aboutPage()">关于本作</button></div></div>';
}
